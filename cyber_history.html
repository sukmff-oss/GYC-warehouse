  * { box-sizing: border-box; }
  html, body {

    background:
      radial-gradient(ellipse at 50% 0%, #1a0040 0%, var(--bg) 60%),

    font-family: "Consolas", "Microsoft JhengHei", monospace;
    color: var(--c1);
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,245,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px,
      rgba(0,0,0,.15) 2px, rgba(0,0,0,.15) 3px);
    z-index: 999; mix-blend-mode: multiply;
  }
  .wrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 16px; }
  h1 {
    margin: 6px 0 16px;
    font-family: "Arial Black", sans-serif;
    font-weight: 900;
    font-size: 24px;
    letter-spacing: 6px;
    color: var(--c1);
    text-shadow: 0 0 4px var(--c1), 0 0 12px var(--c1), 2px 0 0 var(--c2), -2px 0 0 var(--c3);
  }
  h1 small {
    display: block; font-size: 10px; letter-spacing: 4px;
    color: var(--c2); margin-top: 4px; text-shadow: 0 0 6px var(--c2); font-weight: 400;
  }
  .back-link {
    display: inline-block; margin-bottom: 16px;
    background: var(--c1); color: #000;
    padding: 6px 14px;
    font-size: 12px; letter-spacing: 2px;
    box-shadow: 0 0 8px var(--c1);
    text-decoration: none;
  }
  .back-link:hover { background: var(--c2); color: #fff; box-shadow: 0 0 12px var(--c2); }

  .cumulative-box {
    background: var(--panel);
    border: 2px solid var(--c4);
    box-shadow: 0 0 18px var(--c4), inset 0 0 18px rgba(255,229,0,.12);
    padding: 18px;
    margin-bottom: 16px;
    text-align: center;
  }
  .cumulative-box .label { font-size: 12px; color: rgba(0,245,255,.7); letter-spacing: 4px; }
  .cumulative-box .big {
    font-family: "Arial Black", sans-serif;
    font-size: 56px;
    color: var(--c4);
    text-shadow: 0 0 12px var(--c4);
    margin: 6px 0;
    letter-spacing: 4px;
  }
  .cumulative-box .sub { font-size: 13px; color: rgba(255,255,255,.8); }

  /* Day cards */
  .day-card {
    background: var(--panel);
    border: 1px solid var(--c1);
    box-shadow: 0 0 8px var(--c1), inset 0 0 14px rgba(0,245,255,.1);
    padding: 16px;
    margin-bottom: 14px;
    position: relative;
  }
  .day-card::before, .day-card::after,
  .day-card > .bl, .day-card > .br {
    content: ""; position: absolute;
    width: 10px; height: 10px;
    border: 2px solid var(--c2);
    box-shadow: 0 0 6px var(--c2);
  }
  .day-card::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .day-card::after  { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
  .day-card > .bl   { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
  .day-card > .br   { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  .day-head {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid rgba(0,245,255,.25);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .day-head h2 {
    margin: 0; color: var(--c2); letter-spacing: 3px;
    text-shadow: 0 0 6px var(--c2);
    font-size: 18px;
    font-family: "Arial Black", sans-serif;
  }
  .day-hit {
    font-family: "Arial Black", sans-serif;
    font-size: 22px;
  }
  .day-hit.good { color: var(--c5); text-shadow: 0 0 8px var(--c5); }
  .day-hit.bad  { color: var(--c6); text-shadow: 0 0 8px var(--c6); }

  .day-macro {
    font-size: 11px;
    color: rgba(0,245,255,.5);
    margin-bottom: 10px;
  }
  .day-macro b { color: #fff; }

  .day-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 6px;
  }
  .day-stock {
    background: rgba(0,0,0,.4);
    padding: 6px 8px;
    border-left: 3px solid var(--c4);
    font-size: 11px;
  }
  .day-stock.up   { border-left-color: var(--c5); }
  .day-stock.down { border-left-color: var(--c6); }
  .day-stock .t { font-family: "Arial Black", sans-serif; color: #fff; font-size: 13px; }

  .footer {
    text-align: center; font-size: 11px; color: rgba(0,245,255,.5);
    margin-top: 20px; padding-bottom: 14px; line-height: 1.7;
  }
  .footer .warn { color: var(--c6); margin-right: 6px; text-shadow: 0 0 6px var(--c6); }
</style>
</head>
