            particles.push({
              x: bx + Math.cos(ang) * 4,
              y: by + Math.sin(ang) * 4,
              vx: Math.cos(ang + (Math.random() - 0.5)) * 120,
              vy: Math.sin(ang + (Math.random() - 0.5)) * 120,
              r: 2 + Math.random() * 2, life: 0.12, maxLife: 0.12, color: "#a4ff6b"
            });
          }
          aiT.fireCd = aiT.fireRate;
        }
      }
    }

    // --- 粒子 ---
    for (var q = particles.length - 1; q >= 0; q--) {
      var pt = particles[q];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.92; pt.vy *= 0.92;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(q, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - 30 * dt);
    if (flash > 0) flash = Math.max(0, flash - dt);

    // 雪花飄落 (世界座標, 不受場景碰撞影響)
    for (var sf = 0; sf < snowParticles.length; sf++) {
      var sp = snowParticles[sf];
      sp.drift += dt;
      sp.x += sp.vx * dt + Math.sin(sp.drift * 1.5) * 8 * dt;
      sp.y += sp.vy * dt;
      if (sp.y > H + 5) {
        sp.y = -5;
        sp.x = Math.random() * W;
      }
      if (sp.x < -10) sp.x = W + 10;
      if (sp.x > W + 10) sp.x = -10;
    }
  }

  function triggerExplosion(x, y, radius, damage) {
    playExplosion();
    // 火花粒子
    for (var i = 0; i < 20; i++) {
      var a = Math.random() * Math.PI * 2, s = 100 + Math.random() * 250;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        r: 2 + Math.random() * 3, life: 0.4 + Math.random() * 0.3,
        maxLife: 0.7,
        color: ["#ffd34d", "#ff8030", "#ff3030"][Math.floor(Math.random() * 3)]
      });
    }
    // 衝擊波 (expansion)
    explosions.push({
      x: x, y: y, radius: 0, maxRadius: radius,
      time: 0.35, maxTime: 0.35,
      damage: damage, hitIds: null
    });
    shake = Math.max(shake, 10);
    flash = Math.max(flash, 0.2);
  }

  // ======================================================
  // ===== 場景物件繪製 =====
    function drawScenery() {
      if (!scenery) return;
      for (var i = 0; i < scenery.length; i++) {
        var s = scenery[i];
        if (s.type === "gravestone") {
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.rot);
          // 石碑陰影
          ctx.fillStyle = "rgba(0,0,0,0.45)";
          ctx.beginPath();
          ctx.ellipse(0, s.h * 0.4, s.w * 0.7, s.w * 0.2, 0, 0, Math.PI * 2);
          ctx.fill();
          // 石碑主體 (矩形 + 圓頂)
          ctx.fillStyle = s.stoneColor;
          // 矩形底
          ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
          // 圓頂
          ctx.beginPath();
          ctx.arc(0, -s.h / 2, s.w / 2, Math.PI, 0);
          ctx.fill();
          // 雪花蓋頂 (75% 機率)
          if (s.snowOnTop) {
            ctx.fillStyle = "rgba(255,255,255,0.85)";
            ctx.beginPath();
            ctx.arc(0, -s.h / 2, s.w / 2 * 0.8, Math.PI, 0);
            ctx.fill();
            // 矩形上也鋪雪
            ctx.fillRect(-s.w / 2 * 0.85, -s.h / 2 + 1, s.w * 0.85, 3);
          }
          // 碑文裂痕 (深色線)
          ctx.strokeStyle = "rgba(0,0,0,0.5)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-2, -s.h / 4);
          ctx.lineTo(1, 0);
          ctx.lineTo(-1, s.h / 4);
          ctx.stroke();
          // 高光 (左側光源)
          ctx.fillStyle = "rgba(255,255,255,0.15)";
          ctx.fillRect(-s.w / 2, -s.h / 2 + 2, s.w * 0.25, s.h - 4);
          ctx.restore();
        } else if (s.type === "fence") {
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.angle);
          // 黑色鐵柵欄 (細條 + 連桿)
          ctx.fillStyle = "#0a0a0a";
          // 上橫桿
          ctx.fillRect(-s.length / 2, -16, s.length, 1.5);
          // 下橫桿
          ctx.fillRect(-s.length / 2, 12, s.length, 1.5);
          // 直條 (每隔 8 px 一條)
          var n = Math.floor(s.length / 8);
          for (var k = 0; k < n; k++) {
            var bx = -s.length / 2 + k * 8 + 4;
            ctx.fillRect(bx, -18, 1, 36);
            // 頂端尖刺
            ctx.beginPath();
            ctx.moveTo(bx - 0.5, -18);
            ctx.lineTo(bx + 0.5, -18);
            ctx.lineTo(bx, -22);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        } else if (s.type === "arch") {
          ctx.save();
          ctx.translate(s.x, s.y);
          // 拱門底座
          ctx.fillStyle = "#2a1a10";
          ctx.fillRect(-30, 0, 60, 4);
          // 左柱
          ctx.fillRect(-28, -40, 6, 40);
          // 右柱
          ctx.fillRect(22, -40, 6, 40);
          // 拱頂弧
          ctx.beginPath();
          ctx.moveTo(-30, -40);
          ctx.lineTo(-28, -40);
          ctx.arc(0, -50, 28, Math.PI, 0);
          ctx.lineTo(28, -40);
          ctx.lineTo(30, -40);
          ctx.lineTo(30, -36);
          ctx.arc(0, -46, 24, 0, Math.PI);
          ctx.lineTo(-30, -36);
          ctx.closePath();
          ctx.fill();
          // 雪花蓋頂
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          ctx.fillRect(-30, -42, 60, 2);
          ctx.beginPath();
          ctx.arc(0, -50, 28, Math.PI, 0);
          ctx.fill();
          ctx.restore();
        } else if (s.type === "mound") {
          ctx.save();
          ctx.translate(s.x, s.y);
          // 墓堆陰影
          ctx.fillStyle = "rgba(0,0,0,0.4)";
          ctx.beginPath();
          ctx.ellipse(0, 3, s.size * 1.2, s.size * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
          // 墓堆主體
          ctx.fillStyle = s.dirtColor;
          ctx.beginPath();
          ctx.ellipse(0, 0, s.size, s.size * 0.6, 0, 0, Math.PI * 2);
          ctx.fill();
          // 高光
          ctx.fillStyle = "rgba(255,255,255,0.18)";
          ctx.beginPath();
          ctx.ellipse(-s.size * 0.3, -s.size * 0.2, s.size * 0.4, s.size * 0.2, 0, 0, Math.PI * 2);
          ctx.fill();
          // 雪花 (30% 機率)
          if (scnRand() < 0.3) {
            ctx.fillStyle = "rgba(255,255,255,0.8)";
            ctx.fillRect(-s.size * 0.5, -s.size * 0.1, s.size, 1);
          }
          ctx.restore();
        }
      }
    }

    // ===== 雪花繪製 (覆蓋在所有場景物件之上) =====
    if (snowParticles) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      for (var sd = 0; sd < snowParticles.length; sd++) {
        var sp2 = snowParticles[sd];
        ctx.beginPath();
        ctx.arc(sp2.x, sp2.y, sp2.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ===== 2.5D 角色繪製 (含 dual 旗標) =====
  // ======================================================
  function drawCharacter2_5D(x, y, palette, opts) {
    var facing = opts.facing;
    var scale = opts.scale || 1.0;
    var isMoving = opts.isMoving;
    var phase = opts.phase || 0;
    var isPlayer = !!opts.isPlayer;
    var weapon = opts.weapon || (isPlayer ? "rifle" : "smg");
    var gunLen = isPlayer ? player.gunLen : (opts.gunLen || 22);
    var gunThick = isPlayer ? player.gunThick : 3.2;
    var bodyH = (isPlayer ? 38 : 32) * scale;
    var bodyW = (isPlayer ? 22 : 18) * scale;
    var headR = (isPlayer ? 9 : 8) * scale;
    var legLen = (isPlayer ? 14 : 12) * scale;
    var armLen = (isPlayer ? 13 : 11) * scale;

    var J = calcJointSwing(phase, isMoving);
    var bodyBob = isMoving ? Math.abs(Math.cos(phase * 1.4)) * 2 : 0;

    // 1) 地面陰影
    ctx.save();
    ctx.translate(x, y - 2);
    ctx.scale(1, ISO_Y_SCALE);
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyW * 0.95, bodyW * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y - bodyBob - bodyH / 2 + 2);

    function drawLeg(hipX, isBackLeg) {
      var sign = isBackLeg ? -1 : 1;
      var swing = J.hip * sign;
      ctx.save();
      ctx.translate(hipX, bodyH * 0.05);
      ctx.rotate(swing);
      ctx.fillStyle = palette.pantsShadow || palette.pants;
      ctx.fillRect(-legW * 0.5, 0, legW, legLen * 0.55);
      ctx.fillStyle = palette.pants;
      ctx.fillRect(-legW * 0.5, 0, legW, legLen * 0.55);
      ctx.fillStyle = palette.pantsHL || palette.pants;
      ctx.fillRect(-legW * 0.5, 0, legW * 0.3, legLen * 0.55);
      fillSphere(0, legLen * 0.55, legW * 0.6, palette.pantsHL || palette.pants, palette.pants, palette.pantsShadow || palette.pants, -1, -1, 1);
      ctx.save();
      ctx.translate(0, legLen * 0.55);
      ctx.rotate(J.knee * sign * 0.4);
      ctx.fillStyle = palette.pantsShadow || palette.pants;
      ctx.fillRect(-legW * 0.45, 0, legW * 0.9, legLen * 0.45);
      ctx.fillStyle = palette.pants;
      ctx.fillRect(-legW * 0.45, 0, legW * 0.9, legLen * 0.45);
      ctx.fillStyle = palette.pantsHL || palette.pants;
      ctx.fillRect(-legW * 0.45, 0, legW * 0.27, legLen * 0.45);
      fillSphere(0, legLen * 0.45 + legW * 0.4, legW * 0.55, palette.bootsHL || palette.boots, palette.boots, sh, 0, 0, 1);
      ctx.restore();
      ctx.restore();
    }
    var legW = 4.5 * scale;
    var sh = palette.pantsShadow || "#000";

    function drawArm(shoulderX, isBackArm, gunType) {
      var sign = isBackArm ? -1 : 1;
      var swingSign = (isPlayer && opts.dual) ? 1 : sign;
      var swing = J.shoulder * swingSign;
      var hasGun = !isBackArm;
      if (isPlayer && opts.dual && isBackArm) {
        hasGun = true;
        gunType = opts.dualWeapon || "smg";
      }
      ctx.save();
      ctx.translate(shoulderX, -bodyH * 0.18);
      ctx.rotate(swing);
      ctx.fillStyle = palette.armShadow || palette.arm;
      ctx.fillRect(-armW * 0.5, 0, armW, armLen * 0.5);
      ctx.fillStyle = palette.arm;
      ctx.fillRect(-armW * 0.5, 0, armW, armLen * 0.5);
      ctx.fillStyle = palette.armHL || palette.arm;
      ctx.fillRect(-armW * 0.5, 0, armW * 0.3, armLen * 0.5);
      fillSphere(0, 0, armW * 0.55, palette.armHL || palette.arm, palette.arm, palette.armShadow || palette.arm, -0.5, -0.5, 1);
      fillSphere(0, armLen * 0.5, armW * 0.55, palette.armHL || palette.arm, palette.arm, palette.armShadow || palette.arm, -0.5, -0.5, 1);
      ctx.save();
      ctx.translate(0, armLen * 0.5);
      ctx.rotate(J.elbow * (hasGun ? 0.4 : 0.6));
      ctx.fillStyle = palette.armShadow || palette.arm;
      ctx.fillRect(-armW * 0.45, 0, armW * 0.9, armLen * 0.5);
      ctx.fillStyle = palette.arm;
      ctx.fillRect(-armW * 0.45, 0, armW * 0.9, armLen * 0.5);
      ctx.fillStyle = palette.armHL || palette.arm;
      ctx.fillRect(-armW * 0.45, 0, armW * 0.27, armLen * 0.5);
      fillSphere(0, armLen * 0.5, armW * 0.6,
        palette.gloveHL || palette.glove || "#0a0a08",
        palette.glove || "#0a0a08", "#000", -0.5, -0.5, 1.2);
      if (hasGun && gunType) {
        drawWeapon(gunType, armW * 0.4, armLen * 0.5, gunLen, gunThick, palette);
      }
      ctx.restore();
      ctx.restore();
    }
    var armW = 4 * scale;

    if (facing === 1) {
      drawLeg(-bodyW * 0.22 + J.hip * 1.5, true);
      drawLeg(bodyW * 0.22 - J.hip * 1.5, false);
      ctx.fillStyle = palette.vestShadow || palette.vest;
      ctx.fillRect(-bodyW / 2, -bodyH / 2 + 2, bodyW, bodyH - legLen - 2);
      ctx.fillStyle = palette.vest;
      ctx.fillRect(-bodyW / 2 + 1, -bodyH / 2 + 3, bodyW - 2, bodyH - legLen - 4);
      if (palette.vestHighlight) {
        ctx.fillStyle = palette.vestHighlight;
        ctx.fillRect(-bodyW / 2 + 1, -bodyH / 2 + 3, 3, bodyH - legLen - 4);
      }
      ctx.fillStyle = palette.pack || palette.vestShadow;
      ctx.fillRect(-bodyW * 0.35, -bodyH / 2 + 6, bodyW * 0.7, bodyH * 0.45);
      ctx.fillStyle = palette.packShadow || "#000";
      ctx.fillRect(-bodyW * 0.35, -bodyH / 2 + 6, bodyW * 0.7, 2);
      ctx.fillRect(-bodyW * 0.35, -bodyH / 2 + bodyH * 0.45 + 4, bodyW * 0.7, 2);
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(-0.5, -bodyH / 2 + 8, 1, bodyH * 0.4);
      ctx.fillStyle = "#5a5a5a";
      ctx.fillRect(bodyW * 0.35 - 2, -bodyH / 2 + bodyH * 0.2, 3, 3);
      drawArm(-bodyW * 0.55, true, null);
      fillSphere(0, -bodyH / 2 - headR * 0.4, headR + 0.5,
        palette.skinHL || palette.skin, palette.skin, palette.skinShadow || palette.skin,
        -headR * 0.3, -headR * 0.3, headR * 0.35);
      fillSphere(0, -bodyH / 2 - headR * 0.4, headR + 1,
        palette.helmetHL || palette.helmet, palette.helmet, palette.helmetRim || palette.helmet,
        -headR * 0.3, -headR * 0.3, headR * 0.4);
      ctx.fillStyle = palette.helmetRim || palette.helmet;
      ctx.fillRect(-headR, -bodyH / 2 - headR * 1.1, headR * 2, 3);
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(-headR, -bodyH / 2 - headR * 0.05, headR * 2, 2);
      drawArm(bodyW * 0.55, false, weapon);
    } else if (facing === 3) {
      drawLeg(-bodyW * 0.22 + J.hip * 1.5, true);
      drawLeg(bodyW * 0.22 - J.hip * 1.5, false);
      ctx.fillStyle = palette.vestShadow || palette.vest;
      ctx.fillRect(-bodyW / 2, -bodyH / 2 + 2, bodyW, bodyH - legLen - 2);
      ctx.fillStyle = palette.vest;
      ctx.fillRect(-bodyW / 2 + 1, -bodyH / 2 + 3, bodyW - 2, bodyH - legLen - 4);
      if (palette.vestHighlight) {
        ctx.fillStyle = palette.vestHighlight;
        ctx.fillRect(-bodyW / 2 + 2, -bodyH / 2 + 4, bodyW * 0.35, bodyH - legLen - 6);
      }
      ctx.fillStyle = palette.vestZip || "rgba(0,0,0,0.5)";
      ctx.fillRect(-0.8, -bodyH / 2 + 4, 1.6, bodyH - legLen - 6);
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(-bodyW * 0.35, bodyH * 0.05, bodyW * 0.25, bodyH * 0.18);
      ctx.fillRect(bodyW * 0.10, bodyH * 0.05, bodyW * 0.25, bodyH * 0.18);
      ctx.fillStyle = "#9aa888";
      ctx.fillRect(-bodyW * 0.35 + bodyW * 0.1, bodyH * 0.05 + bodyH * 0.18 - 1, 2, 1);
      ctx.fillRect(bodyW * 0.10 + bodyW * 0.1, bodyH * 0.05 + bodyH * 0.18 - 1, 2, 1);
      for (var bI = 0; bI < 4; bI++) {
        ctx.fillStyle = "#3a2818";
        ctx.fillRect(-bodyW * 0.3 + bI * 2.5, bodyH * 0.28, 1.8, 1.5);
        ctx.fillStyle = "#9a7048";
        ctx.fillRect(-bodyW * 0.3 + bI * 2.5, bodyH * 0.28, 1.8, 0.4);
      }
      ctx.fillStyle = "#888";
      ctx.fillRect(bodyW * 0.05, -bodyH / 2 + 6, 3, 4);
      ctx.fillStyle = "#5a5a5a";
      ctx.fillRect(bodyW * 0.05, -bodyH / 2 + 9, 3, 0.5);
      drawArm(-bodyW * 0.55, true, null);
      fillSphere(0, -bodyH / 2 - headR * 0.5, headR,
        palette.skinHL || palette.skin, palette.skin, palette.skinShadow || palette.skin,
        -headR * 0.3, -headR * 0.3, headR * 0.35);
      fillSphere(0, -bodyH / 2 - headR * 0.5, headR + 1,
        palette.helmetHL || palette.helmet, palette.helmet, palette.helmetRim || palette.helmet,
        -headR * 0.3, -headR * 0.3, headR * 0.4);
      ctx.fillStyle = "rgba(0,0,0,0.85)";
      ctx.fillRect(-headR * 0.85, -bodyH / 2 - headR * 0.5 - 1, headR * 1.7, headR * 0.4);
      ctx.fillStyle = palette.helmetRim || "#000";
      ctx.fillRect(-headR * 0.9, -bodyH / 2 - headR * 0.5 - 1.5, headR * 1.8, 0.8);
      ctx.fillRect(-headR * 0.9, -bodyH / 2 - headR * 0.5 + headR * 0.4 - 0.5, headR * 1.8, 0.8);
      ctx.fillStyle = "rgba(180,220,255,0.7)";
      ctx.fillRect(-headR * 0.7, -bodyH / 2 - headR * 0.5 - 0.5, headR * 0.4, 1);
      ctx.fillStyle = "rgba(180,220,255,0.4)";
      ctx.fillRect(headR * 0.3, -bodyH / 2 - headR * 0.5 - 0.5, headR * 0.2, 0.8);
      ctx.fillStyle = palette.skinShadow || palette.skin;
      ctx.fillRect(-headR * 0.5, -bodyH / 2 - headR * 0.05, headR, headR * 0.5);
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(-headR * 0.4, -bodyH / 2 - headR * 0.05 + headR * 0.15, headR * 0.8, 0.5);
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(-headR, -bodyH / 2 - headR * 0.05, headR * 2, 1.5);
      if (isPlayer) {
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(headR * 0.4, -bodyH / 2 - headR * 1.6, 1, headR * 0.6);
        ctx.fillStyle = "#ff3333";
        ctx.fillRect(headR * 0.3, -bodyH / 2 - headR * 1.65, 2, 1.5);
      }
      drawArm(bodyW * 0.55, false, weapon);
    } else if (facing === 0) {
      drawLeg(-bodyW * 0.10 + J.hip * 1.2, true);
      drawLeg(bodyW * 0.10 - J.hip * 1.2, false);
      ctx.fillStyle = palette.vestShadow || palette.vest;
      ctx.beginPath();
      ctx.moveTo(-bodyW * 0.35, -bodyH / 2 + 2);
      ctx.lineTo(bodyW * 0.35, -bodyH / 2 + 2);
      ctx.lineTo(bodyW * 0.30, bodyH * 0.15);
      ctx.lineTo(-bodyW * 0.30, bodyH * 0.15);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = palette.vest;
      ctx.beginPath();
      ctx.moveTo(-bodyW * 0.35, -bodyH / 2 + 2);
      ctx.lineTo(-bodyW * 0.10, -bodyH / 2 + 2);
      ctx.lineTo(-bodyW * 0.10, bodyH * 0.15);
      ctx.lineTo(-bodyW * 0.30, bodyH * 0.15);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#5a5a5a";
      ctx.beginPath();
      ctx.arc(0, -bodyH * 0.15, 1, 0, Math.PI * 2);
      ctx.fill();
      drawArm(-bodyW * 0.40, true, null);
      ctx.fillStyle = palette.skinShadow || palette.skin;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15, -bodyH / 2 - headR * 0.3, headR * 0.95, headR, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.skin;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15, -bodyH / 2 - headR * 0.3, headR * 0.85, headR * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.skinShadow || palette.skin;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15 + headR * 0.7, -bodyH / 2 - headR * 0.25, headR * 0.25, headR * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.skin;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15 + headR * 0.7, -bodyH / 2 - headR * 0.35, headR * 0.2, headR * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.helmetRim || palette.helmet;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15, -bodyH / 2 - headR * 0.4, headR + 0.5, headR * 1.1, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.helmet;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15, -bodyH / 2 - headR * 0.4, headR + 0.3, headR * 1.0, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.helmetHL || palette.helmet;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.05, -bodyH / 2 - headR * 0.6, headR * 0.6, headR * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,0.85)";
      ctx.fillRect(bodyW * 0.15 - headR * 0.4, -bodyH / 2 - headR * 0.4, headR * 1.2, headR * 0.35);
      ctx.fillStyle = "rgba(180,220,255,0.7)";
      ctx.fillRect(bodyW * 0.15 - headR * 0.3, -bodyH / 2 - headR * 0.4, headR * 0.4, 1);
      drawArm(bodyW * 0.20, false, weapon);
    } else if (facing === 2) {
      ctx.scale(-1, 1);
      drawLeg(-bodyW * 0.10 + J.hip * 1.2, true);
      drawLeg(bodyW * 0.10 - J.hip * 1.2, false);
      ctx.fillStyle = palette.vestShadow || palette.vest;
      ctx.beginPath();
      ctx.moveTo(-bodyW * 0.35, -bodyH / 2 + 2);
      ctx.lineTo(bodyW * 0.35, -bodyH / 2 + 2);
      ctx.lineTo(bodyW * 0.30, bodyH * 0.15);
      ctx.lineTo(-bodyW * 0.30, bodyH * 0.15);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = palette.vest;
      ctx.beginPath();
      ctx.moveTo(-bodyW * 0.35, -bodyH / 2 + 2);
      ctx.lineTo(-bodyW * 0.10, -bodyH / 2 + 2);
      ctx.lineTo(-bodyW * 0.10, bodyH * 0.15);
      ctx.lineTo(-bodyW * 0.30, bodyH * 0.15);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#5a5a5a";
      ctx.beginPath();
      ctx.arc(0, -bodyH * 0.15, 1, 0, Math.PI * 2);
      ctx.fill();
      drawArm(-bodyW * 0.40, true, null);
      ctx.fillStyle = palette.skinShadow || palette.skin;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15, -bodyH / 2 - headR * 0.3, headR * 0.95, headR, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.skin;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15, -bodyH / 2 - headR * 0.3, headR * 0.85, headR * 0.9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.skinShadow || palette.skin;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15 + headR * 0.7, -bodyH / 2 - headR * 0.25, headR * 0.25, headR * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.skin;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15 + headR * 0.7, -bodyH / 2 - headR * 0.35, headR * 0.2, headR * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.helmetRim || palette.helmet;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15, -bodyH / 2 - headR * 0.4, headR + 0.5, headR * 1.1, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.helmet;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.15, -bodyH / 2 - headR * 0.4, headR + 0.3, headR * 1.0, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = palette.helmetHL || palette.helmet;
      ctx.beginPath();
      ctx.ellipse(bodyW * 0.05, -bodyH / 2 - headR * 0.6, headR * 0.6, headR * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,0.85)";
      ctx.fillRect(bodyW * 0.15 - headR * 0.4, -bodyH / 2 - headR * 0.4, headR * 1.2, headR * 0.35);
      ctx.fillStyle = "rgba(180,220,255,0.7)";
      ctx.fillRect(bodyW * 0.15 - headR * 0.3, -bodyH / 2 - headR * 0.4, headR * 0.4, 1);
      drawArm(bodyW * 0.20, false, weapon);
    }
    ctx.restore();
  }

  // ===== 3D 立體子彈 =====
  function drawBullet(b) {
    var by2 = b.y - (b.z || 0);
    ctx.save();
    ctx.translate(b.x, by2);
    ctx.rotate(b.rot || 0);
    var tailLen = 12;
    var tailGrad = ctx.createLinearGradient(-tailLen, 0, 0, 0);
    if (b.gold) {
      tailGrad.addColorStop(0, "rgba(255, 211, 77, 0)");
      tailGrad.addColorStop(1, "rgba(255, 255, 200, 0.95)");
    } else {
      tailGrad.addColorStop(0, "rgba(255, 211, 77, 0)");
      tailGrad.addColorStop(1, "rgba(255, 211, 77, 0.7)");
    }
    ctx.fillStyle = tailGrad;
    ctx.beginPath();
    ctx.moveTo(-tailLen, -b.r * 0.6);
    ctx.lineTo(0, -b.r);
    ctx.lineTo(0, b.r);
    ctx.lineTo(-tailLen, b.r * 0.6);
    ctx.closePath();
    ctx.fill();
    if (b.gold) {
      fillSphere(0, 0, b.r, "#ffffff", "#ffd34d", "#aa8030", -b.r * 0.3, -b.r * 0.3, b.r * 0.35);
      // 金色光暈
      ctx.fillStyle = "rgba(255, 220, 100, 0.3)";
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 1.8, 0, Math.PI * 2);
      ctx.fill();
    } else {
      fillSphere(0, 0, b.r, "#ffffff", "#ffe98a", "#aa8030", -b.r * 0.3, -b.r * 0.3, b.r * 0.35);
    }
    ctx.restore();
  }

  // ===== 飛彈 (追蹤彈) =====
  function drawMissile(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    // 煙尾 (長)
    var tailLen = 22;
    var tailGrad = ctx.createLinearGradient(-tailLen, 0, 0, 0);
    tailGrad.addColorStop(0, "rgba(164, 255, 107, 0)");
    tailGrad.addColorStop(0.7, "rgba(164, 255, 107, 0.6)");
    tailGrad.addColorStop(1, "rgba(255, 255, 255, 0.95)");
    ctx.fillStyle = tailGrad;
    ctx.beginPath();
    ctx.moveTo(-tailLen, -3);
    ctx.lineTo(-2, -3);
    ctx.lineTo(-2, 3);
    ctx.lineTo(-tailLen, 3);
    ctx.closePath();
    ctx.fill();
    // 飛彈主體 (圓柱 + 錐頭)
    ctx.fillStyle = "#a4ff6b";
    ctx.fillRect(-4, -2.5, 10, 5);
    ctx.fillStyle = "#6bd455";
    ctx.fillRect(-4, 1.5, 10, 1);
    // 錐頭
    ctx.fillStyle = "#dfffb0";
    ctx.beginPath();
    ctx.moveTo(6, -2.5);
    ctx.lineTo(10, 0);
    ctx.lineTo(6, 2.5);
    ctx.closePath();
    ctx.fill();
    // 翼 (後)
    ctx.fillStyle = "#3a8a20";
    ctx.fillRect(-6, -2.5, 2, 1.5);
    ctx.fillRect(-6, 1, 2, 1.5);
    ctx.restore();
  }

  // ===== 無人機 (主題型, 4 旋翼 + LED) =====
  function drawDrone(d) {
    ctx.save();
    ctx.translate(d.x, d.y);
    // 陰影 (地面投影)
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(0, 14, 14, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // 主體 (中央金屬盒)
    fillSphere(0, 0, 7, "#888", "#444", "#222", -1.5, -1.5, 2);
    // LED 燈 (脈動)
    var ledPulse = 0.7 + Math.sin(gameTime * 6) * 0.3;
    ctx.fillStyle = "rgba(255, 80, 80, " + ledPulse + ")";
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 200, 200, 0.6)";
    ctx.beginPath();
    ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // 4 個旋翼支架 + 旋翼 (旋轉動畫)
    var armOffsets = [
      [-9, -6], [9, -6], [-9, 6], [9, 6]
    ];
    for (var i = 0; i < 4; i++) {
      var ox = armOffsets[i][0], oy = armOffsets[i][1];
      // 支架
      ctx.fillStyle = "#555";
      ctx.fillRect(ox - 1, oy - 1, 2, 2);
      // 馬達座
      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.arc(ox, oy, 2, 0, Math.PI * 2);
      ctx.fill();
      // 旋翼 (透明高速旋轉效果)
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(d.spin * (i % 2 === 0 ? 1 : -1));
      // 旋翼輪廓 (模糊效果: 兩條交叉淡線 + 弧)
      ctx.strokeStyle = "rgba(180,180,180,0.5)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 1.5, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, 0, 1.5, 7, 0, 0, Math.PI * 2);
      ctx.stroke();
      // 旋翼中心
      ctx.fillStyle = "#aaa";
      ctx.beginPath();
      ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // 鎖定線 (瞄準最近的敵人)
    if (d.targetEnemy) {
      ctx.strokeStyle = "rgba(255, 80, 80, 0.6)";
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(d.targetEnemy.x - d.x, d.targetEnemy.y - d.y);
      ctx.stroke();
      ctx.setLineDash([]);
      // 敵人身上的紅圈
      ctx.fillStyle = "rgba(255, 60, 60, 0.4)";
      ctx.beginPath();
      ctx.arc(d.targetEnemy.x - d.x, d.targetEnemy.y - d.y, 14, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ===== 爆炸擴散 (衝擊波) =====
  function drawExplosion(e) {
    var t = 1 - e.time / e.maxTime;
    var r = e.maxRadius * t;
    ctx.save();
    // 外圈 (亮橙)
    ctx.strokeStyle = "rgba(255, 200, 80, " + (1 - t) + ")";
    ctx.lineWidth = 4 * (1 - t) + 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
    ctx.stroke();
    // 內圈 (深紅)
    ctx.strokeStyle = "rgba(255, 80, 30, " + (1 - t) * 0.7 + ")";
    ctx.lineWidth = 2 * (1 - t);
    ctx.beginPath();
    ctx.arc(e.x, e.y, r * 0.6, 0, Math.PI * 2);
    ctx.stroke();
    // 中心火球
    var fireR = 12 * (1 - t * 0.5);
    fillSphere(e.x, e.y, fireR, "#ffeb70", "#ff8030", "#ff2010", -fireR * 0.3, -fireR * 0.3, fireR * 0.3);
    ctx.restore();
  }

  // ===== BOSS 繪製 (大尺寸 + 加血條 + 類型指示) =====
  function drawBoss(boss) {
    // BOSS 配色 (依類型)
    var palette = boss.type === "tank" ? COLOR.heavy
                : boss.type === "heavy" ? COLOR.heavy
                : COLOR.normal;

    // 巨大的地面陰影
    ctx.save();
    ctx.translate(boss.x, boss.y - 4);
    ctx.scale(1, ISO_Y_SCALE);
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.beginPath();
    ctx.ellipse(0, 0, boss.scale * 22, boss.scale * 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 受擊白閃
    if (boss.hitFlash > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.random() * 0.5;
    }

    // 用 drawCharacter2_5D 但 scale 加大
    drawCharacter2_5D(boss.x, boss.y, palette, {
      facing: boss.facing,
      scale: boss.scale,
      isMoving: Math.hypot(boss.x - boss._lastX, boss.y - boss._lastY) > 0.5,
      phase: boss._animPhase,
      weapon: boss.weapon === "spit" ? "smg" : boss.weapon  // spitter 用 SMG 簡化
    });

    if (boss.hitFlash > 0) ctx.restore();

    // BOSS 大血條 (貼頭頂上方)
    var barW = 60 * boss.scale;
    var barH = 8;
    var barY = boss.y - boss.scale * 38 - 10;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(boss.x - barW / 2, barY, barW, barH);
    // 血條本體 (綠→黃→紅漸層)
    var hpRatio = boss.hp / boss.maxHp;
    var hpGrad = ctx.createLinearGradient(boss.x - barW / 2, 0, boss.x + barW / 2, 0);
    if (hpRatio > 0.5) {
      hpGrad.addColorStop(0, "#ff5050");
      hpGrad.addColorStop(1, "#ffaa30");
    } else if (hpRatio > 0.25) {
      hpGrad.addColorStop(0, "#ff8030");
      hpGrad.addColorStop(1, "#ffaa30");
    } else {
      hpGrad.addColorStop(0, "#ff5050");
      hpGrad.addColorStop(1, "#ff2020");
    }
    ctx.fillStyle = hpGrad;
    ctx.fillRect(boss.x - barW / 2, barY, barW * hpRatio, barH);
    // 血條框
    ctx.strokeStyle = "rgba(0,0,0,0.6)";
    ctx.lineWidth = 1;
    ctx.strokeRect(boss.x - barW / 2, barY, barW, barH);
    // 類型標籤
    ctx.fillStyle = "#ffd34d";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    var typeLabel = boss.type === "tank" ? "TANK"
                  : boss.type === "heavy" ? "HEAVY"
                  : "SPITTER";
    ctx.fillText(typeLabel + " " + Math.ceil(hpRatio * 100) + "%", boss.x, barY - 4);
    ctx.textAlign = "start";
  }

  // ===== 機槍班 AI 臥姿繪製 =====
  function drawTeammate(t) {
    // 鎖定方向 (朝目標)
    var ang = 0;
    if (t.target) ang = Math.atan2(t.target.y - t.y, t.target.x - t.x);

    ctx.save();

    // 1) 地面陰影 (橢圓, 較深 — 因為身體平躺)
    ctx.save();
    ctx.translate(t.x, t.y - 2);
    ctx.scale(1, ISO_Y_SCALE * 0.7);
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.ellipse(0, 0, 32, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 2) 沙包 (3 個堆疊, 在身體前方)
    ctx.save();
    ctx.translate(t.x, t.y + 4);
    ctx.rotate(ang);
    // 後沙包 (陰影)
    ctx.fillStyle = "#6a583a";
    ctx.fillRect(-22, -10, 18, 14);
    // 中沙包
    ctx.fillStyle = "#8a7548";
    ctx.fillRect(-12, -12, 18, 14);
    // 前沙包 (亮)
    ctx.fillStyle = "#a48c5c";
    ctx.fillRect(-2, -14, 18, 14);
    // 沙袋紋
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    for (var sx = 0; sx < 3; sx++) {
      ctx.fillRect(-22 + sx * 18, -12, 1, 16);
    }
    ctx.restore();

    // 3) 槍 (從沙包上方伸出)
    ctx.save();
    ctx.translate(t.x, t.y + 4);
    ctx.rotate(ang);
    // 槍托 (藏身體後)
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(-8, -3, 6, 6);
    // 機匣
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(-2, -2.5, 18, 5);
    // 槍管 (圓柱)
    fillCylinder(16, 0, 22, 4, "#6a6a6a", "#2a2a2a", "#0a0a0a");
    // 準星
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(26, -3, 1.5, 2);
    // 彈鏈
    ctx.fillStyle = "#1a1a1a";
    for (var bc = 0; bc < 4; bc++) {
      ctx.fillRect(-2 + bc * 4, 3, 3, 2);
    }
    ctx.restore();

    // 4) 人物身體 (臥姿 — 平躺 + 胸口微抬 + 雙臂前伸)
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(ang);

    // 腿 (平躺, 微分開)
    // 左腿
    ctx.fillStyle = "#1f261a";
    ctx.fillRect(-22, -3, 24, 5);
    // 右腿
    ctx.fillStyle = "#2a3624";
    ctx.fillRect(-22, 2, 24, 5);
    // 靴子 (前)
    ctx.fillStyle = "#0a0a08";
    ctx.fillRect(0, -4, 6, 4);
    ctx.fillRect(0, 4, 6, 4);

    // 軀幹 (戰術背心)
    ctx.fillStyle = "#2a3818";
    ctx.fillRect(-12, -6, 18, 12);
    // 背心高光
    ctx.fillStyle = "#3d4f2a";
    ctx.fillRect(-12, -6, 18, 4);
    // 中央拉鍊
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(-3, -5, 1, 10);

    // 雙臂 (前伸持槍, 從肩到槍托位置)
    // 上臂
    ctx.fillStyle = "#2a3818";
    ctx.fillRect(0, -5, 8, 3);
    ctx.fillRect(0, 2, 8, 3);
    // 前臂 (握槍, 顏色較淺)
    ctx.fillStyle = "#c89878";
    ctx.fillRect(6, -4, 6, 2);
    ctx.fillRect(6, 2, 6, 2);
    // 手套 (在槍托位置)
    ctx.fillStyle = "#0a0a08";
    ctx.fillRect(12, -3, 2, 2);
    ctx.fillRect(12, 1, 2, 2);

    // 頭 (枕在地面, 朝前看, 微抬)
    fillSphere(14, -8, 5,
      "#c89878", "#c89878", "#a87858",
      -1, -1, 1.5);
    // 頭盔
    fillSphere(14, -8, 6,
      "#2a3a1a", "#2a3a1a", "#1a2810",
      -1.5, -1.5, 2);
    // 護目鏡 (橫條)
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(10, -10, 8, 2);
    // 護目反光
    ctx.fillStyle = "rgba(180,220,255,0.7)";
    ctx.fillRect(11, -10, 2, 1);

    ctx.restore();

    // 5) HP 血條 (貼頭頂上方)
    if (t.hp < t.maxHp) {
      var bw = 36;
      var by = t.y - 18;
      // 陰影
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(t.x - bw / 2, by, bw, 5);
      // 血條 (綠→黃漸層)
      var hpRatio = t.hp / t.maxHp;
      var hpGrad = ctx.createLinearGradient(t.x - bw / 2, 0, t.x + bw / 2, 0);
      if (hpRatio > 0.5) {
        hpGrad.addColorStop(0, "#4a9a5a");
        hpGrad.addColorStop(1, "#aaffbf");
      } else {
        hpGrad.addColorStop(0, "#9a4a4a");
        hpGrad.addColorStop(1, "#ffaa4a");
      }
      ctx.fillStyle = hpGrad;
      ctx.fillRect(t.x - bw / 2, by, bw * hpRatio, 5);
    }

    // 6) 鎖定線 (如果有目標)
    if (t.target) {
      ctx.strokeStyle = "rgba(255, 80, 80, 0.5)";
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(t.x, t.y - 6);
      ctx.lineTo(t.target.x - t.x, t.target.y - t.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  // ===== 隊友玩家繪製 (站立人型, 5 種類型) =====
  function drawTeammatePlayer(t) {
    var pal = t.def.palette;
    var ang = t.target ? Math.atan2(t.target.y - t.y, t.target.x - t.x) : 0;

    ctx.save();
    ctx.translate(t.x, t.y);

    // 1) 陰影
    ctx.save();
    ctx.scale(1, ISO_Y_SCALE);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 2) 全身站立人 (用 drawCharacter2_5D 但傳入對應 palette)
    var palette = {
      helmet: pal.helmet, helmetHL: pal.helmet, helmetRim: pal.helmet,
      skin: pal.skin, skinShadow: pal.skin, skinHL: pal.skin,
      vest: pal.vest, vestShadow: pal.vest, vestHighlight: pal.vest, vestZip: "#9aa888",
      pants: pal.pants, pantsShadow: pal.pants, pantsHL: pal.pants,
      boots: pal.boots, bootsHL: pal.boots,
      gun: pal.gun, gunHighlight: "#888", gunShadow: "#0a0a0a", gunStock: pal.gun,
      pack: pal.pack, packShadow: pal.pack,
      arm: pal.arm, armShadow: pal.arm, armHL: pal.arm,
      glove: "#0a0a08", gloveHL: "#2a2a28"
    };
    var weapon = t.def.weapon === "katana" ? "smg"
               : t.def.weapon === "pistol" ? "pistol"
               : t.def.weapon === "rocket" ? "shotgun"
               : t.def.weapon === "laser" ? "rifle"
               : "mg";
    // 站立 (scale 1.0)
    drawCharacter2_5D(0, 0, palette, {
      facing: t.facing, scale: 0.95, isMoving: false, phase: 0,
      weapon: weapon
    });

    // 3) 武器視覺 (依類型在頭頂加 icon)
    ctx.fillStyle = t.def.labelColor;
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(t.def.label, 0, -42);
    ctx.textAlign = "start";

    // 4) 鎖定線 (若有目標)
    if (t.target) {
      ctx.strokeStyle = "rgba(255, 255, 100, 0.5)";
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(t.target.x - t.x, t.target.y - t.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  // ===== 防護罩 (能量場) =====
  function drawShield() {
    if (!player.shield.active) return;
    var t = player.shield.time / player.shield.max;  // 剩餘比例 (1 → 0)
    var fade = t < 0.3 ? t / 0.3 : 1;  // 最後 3 秒淡出
    ctx.save();
    var x = player.x, y = player.y;
    // 外環 (青色)
    ctx.strokeStyle = "rgba(107, 212, 255, " + (0.4 * fade) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 30, 0, Math.PI * 2);
    ctx.stroke();
    // 內環 (亮白)
    ctx.strokeStyle = "rgba(180, 240, 255, " + (0.6 * fade) + ")";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, 27, 0, Math.PI * 2);
    ctx.stroke();
    // 6 邊形繞圈粒子 (旋轉)
    for (var i = 0; i < 6; i++) {
      var a = gameTime * 1.5 + i * (Math.PI * 2 / 6);
      var px = x + Math.cos(a) * 30;
      var py = y + Math.sin(a) * 30 * 0.55;  // 橢圓 (2.5D)
      var particleR = 2 + Math.sin(gameTime * 4 + i) * 0.5;
      fillSphere(px, py, particleR,
        "rgba(220, 245, 255, " + (0.9 * fade) + ")",
        "rgba(107, 212, 255, " + (0.7 * fade) + ")",
        "rgba(40, 100, 180, " + (0.5 * fade) + ")",
        -1, -1, 0.8);
    }
    // 反向旋轉的內圈粒子
    for (var j = 0; j < 4; j++) {
      var a2 = -gameTime * 2 + j * (Math.PI * 2 / 4);
      var px2 = x + Math.cos(a2) * 22;
      var py2 = y + Math.sin(a2) * 22 * 0.55;
      fillSphere(px2, py2, 1.5,
        "rgba(255, 255, 255, " + (0.8 * fade) + ")",
        "rgba(180, 230, 255, " + (0.6 * fade) + ")",
        "rgba(60, 140, 200, " + (0.4 * fade) + ")",
        -0.5, -0.5, 0.5);
    }
    // 中心脈動
    var pulse = 0.3 + Math.sin(gameTime * 3) * 0.15;
    ctx.fillStyle = "rgba(107, 212, 255, " + (pulse * fade * 0.3) + ")";
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ===== 繪製 =====
  function drawGrid() {
    ctx.strokeStyle = "rgba(255,255,255,0.045)";
    ctx.lineWidth = 1;
    var gw = 64, gh = gw * ISO_Y_SCALE;
    ctx.beginPath();
    for (var x = 0; x <= W; x += gw) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (var y = 0; y <= H; y += gh) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0b0e14";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawGrid();

    // 場景物件 (在地面 + 角色下層)
    drawScenery();

    // 拾取物
    for (var p = 0; p < pickups.length; p++) {
      var pk = pickups[p];
      var pulse = 1 + Math.sin(pk.pulse * 6) * 0.15;
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath(); ctx.ellipse(pk.x, pk.y + 1, pk.r * 1.1 * pulse, pk.r * 0.5 * pulse, 0, 0, Math.PI * 2); ctx.fill();
      if (pk.type === "shield") {
        // 防護罩道具 (藍色+閃光)
        fillSphere(pk.x, pk.y, pk.r * pulse,
          "#aae8ff", "#6bd4ff", "#1a4866",
          -pk.r * 0.3, -pk.r * 0.3, pk.r * 0.35);
        // 護盾十字
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pk.x, pk.y, pk.r * 0.7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pk.x - pk.r * 0.5, pk.y);
        ctx.lineTo(pk.x + pk.r * 0.5, pk.y);
        ctx.moveTo(pk.x, pk.y - pk.r * 0.5);
        ctx.lineTo(pk.x, pk.y + pk.r * 0.5);
        ctx.stroke();
      } else if (pk.type === "gold_weapon") {
        // 金色武器道具 (神裝) — 旋轉光暈 + 武器圖示
        var goldSpin = Math.sin(pk.pulse * 2) * 0.3;
        ctx.save();
        ctx.translate(pk.x, pk.y);
        // 金色光暈 (旋轉)
        ctx.fillStyle = "rgba(255, 220, 100, 0.4)";
        ctx.beginPath();
        ctx.arc(0, 0, pk.r * 2 + Math.sin(pk.pulse * 4) * 2, 0, Math.PI * 2);
        ctx.fill();
        // 球體
        fillSphere(0, 0, pk.r * pulse,
          "#ffffff", "#ffd34d", "#aa8030",
          -pk.r * 0.3, -pk.r * 0.3, pk.r * 0.35);
        // 武器 icon (依類型顯示)
        ctx.rotate(goldSpin);
        ctx.fillStyle = "#5a3818";
        ctx.fillRect(-2, -8, 4, 16);
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(-1, -10, 2, 20);
        // 武器標籤
        ctx.rotate(-goldSpin);
        var wName = pk.weapon === "crimson_rifle" ? "CRIMSON"
                   : pk.weapon === "platinum_pistol" ? "PLATINUM"
                   : "GOLDEN";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 9px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(wName, 0, pk.r + 14);
        ctx.textAlign = "start";
        ctx.restore();
      } else {
        // 補血包
        fillSphere(pk.x, pk.y, pk.r * pulse,
          "#aaffbf", "#6bff8f", "#1a3a26",
          -pk.r * 0.3, -pk.r * 0.3, pk.r * 0.35);
        ctx.fillStyle = "#1d3a26";
        ctx.fillRect(pk.x - 2, pk.y - 5, 4, 10);
        ctx.fillRect(pk.x - 5, pk.y - 2, 10, 4);
      }
    }

    // 敵人 (y 排序)
    enemies.sort(function (a, b) {
      return ((a.y - (a.z || 0)) || a.y) - ((b.y - (b.z || 0)) || b.y);
    });

    for (var j = 0; j < enemies.length; j++) {
      var e = enemies[j];
      var moved = Math.hypot(e.x - e._lastX, e.y - e._lastY);
      var isMoving = moved > 0.5;
      var palette = e.type === "heavy" ? COLOR.heavy
                  : e.type === "fast"  ? COLOR.fast
                  : COLOR.normal;
      if (e.hitFlash > 0) {
        ctx.save();
        ctx.globalAlpha = 0.5 + Math.random() * 0.5;
      }
      drawCharacter2_5D(e.x, e.y, palette, {
        facing: e.facing, scale: e.scale,
        isMoving: isMoving, phase: e._animPhase,
        weapon: e.weapon
      });
      if (e.hitFlash > 0) ctx.restore();
      if (e.hp < e.maxHp) {
        var bw2 = (e.scale || 1) * 38;
        var by = e.y - (e.scale || 1) * 38 - 8;
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(e.x - bw2 / 2, by, bw2, 4);
        var hpGrad = ctx.createLinearGradient(e.x - bw2 / 2, 0, e.x + bw2 / 2, 0);
        hpGrad.addColorStop(0, "#4a9a5a");
        hpGrad.addColorStop(1, "#aaffbf");
        ctx.fillStyle = hpGrad;
        ctx.fillRect(e.x - bw2 / 2, by, bw2 * (e.hp / e.maxHp), 4);
      }
    }

    // 子彈 (玩家)
    for (var i = 0; i < bullets.length; i++) drawBullet(bullets[i]);

    // 飛彈 (無人機)
    for (var mi = 0; mi < missiles.length; mi++) drawMissile(missiles[mi]);

    // 爆炸擴散
    for (var ex = 0; ex < explosions.length; ex++) drawExplosion(explosions[ex]);

    // 玩家
    if (state === STATE.PLAY) {
      var blink = player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0;
      if (!blink) {
        var pmoved = Math.hypot(player.x - _prevPx, player.y - _prevPy);
        var pMoving = pmoved > 0.5;
        var pPhase = gameTime * 8;
        drawCharacter2_5D(player.x, player.y, COLOR.player, {
          facing: player.facing, scale: 1.0,
          isMoving: pMoving, phase: pPhase,
          isPlayer: true,
          weapon: player.dual ? "smg" : "rifle",
          dual: player.dual
        });
      }
    }

    // 無人機 (在玩家上方層)
    for (var di = 0; di < drones.length; di++) drawDrone(drones[di]);

    // 機槍班 AI (臥姿 + 沙包)
    for (var ti = 0; ti < aiTeammates.length; ti++) drawTeammate(aiTeammates[ti]);

    // 隊友 (5 種類型)
    for (var tmi = 0; tmi < teammates.length; tmi++) drawTeammatePlayer(teammates[tmi]);

    // BOSS (大尺寸 3D 人物)
    for (var bi = 0; bi < bosses.length; bi++) drawBoss(bosses[bi]);

    // 防護罩 (最上層,環繞玩家)
    drawShield();

    // 粒子
    for (var q = 0; q < particles.length; q++) {
      var pt = particles[q];
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (touchMove) {
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(touchMove.sx, touchMove.sy, 48, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.arc(touchMove.sx + touchMove.dx * 40, touchMove.sy + touchMove.dy * 40, 20, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255, 40, 40, " + (flash * 0.6) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(t) {
    var dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;
    if (state === STATE.PLAY) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resetGame();
    state = STATE.PLAY;
    menuEl.classList.add("hidden");
    overEl.classList.add("hidden");
    hudEl.classList.remove("hidden");
    // 繪製頭像
    drawCharAvatar();
    drawEvoAvatar();
    updateHud();
  }

  function gameOver() {
    state = STATE.OVER;
    finalScoreEl.textContent = "得分 " + score;
    hudEl.classList.add("hidden");
    overEl.classList.remove("hidden");
    mouse.down = false;
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);
  document.getElementById("audioBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    toggleAudio();
  });

  // 首次互動時初始化 audio (瀏覽器 autoplay policy 要求)
  var _audioInitialized = false;
  function initAudioOnce() {
    if (_audioInitialized) return;
    _audioInitialized = true;
    initAudio();
    if (audioEnabled) startBGM();
  }
  document.addEventListener("click", initAudioOnce, { once: false });
  document.addEventListener("keydown", initAudioOnce, { once: false });

  resetGame();
  generateScenery();
  // 雪花初始填滿
  for (var si = 0; si < 80; si++) {
    snowParticles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: -10 + Math.random() * 20,
      vy: 20 + Math.random() * 30,
      r: 1 + Math.random() * 2,
      drift: Math.random() * Math.PI * 2
    });
  }
  // 錯誤捕獲: 任何 JS 錯誤顯示在畫面上, 方便調試
  window.addEventListener("error", function (e) {
    try {
      var menu = document.getElementById("menu");
      if (menu && !menu.classList.contains("hidden")) return; // 選單還在,正常
      var body = document.body;
      var err = document.createElement("div");
      err.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(120,0,0,0.92);color:#fff;padding:24px;border-radius:12px;z-index:9999;max-width:80%;font-family:monospace;font-size:13px;line-height:1.5;";
      err.innerHTML = "<b>⚠️ 遊戲載入失敗</b><br>" + (e.message || e.error || "未知錯誤").replace(/</g, "&lt;") + "<br><br><small>請按 Ctrl+Shift+R 強制重整瀏覽器</small>";
      body.appendChild(err);
    } catch (_) {}
  });

  requestAnimationFrame(function (t) { lastTime = t; loop(t); });
})();
</script>
</body>
</html>
