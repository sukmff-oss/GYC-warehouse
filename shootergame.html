<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>叢林槍戰突圍 · 2.5D Isometric</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0e14;
    overflow: hidden;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(8, 10, 16, 0.82);
    backdrop-filter: blur(6px);
    z-index: 10;
    color: #e8ecf4;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: clamp(36px, 8vw, 64px);
    letter-spacing: 0.15em;
    color: #ffd34d;
    text-shadow: 0 0 24px rgba(255, 211, 77, 0.45);
    margin-bottom: 12px;
  }
  .overlay p { color: #9aa4b8; line-height: 1.9; font-size: 15px; margin-bottom: 28px; }
  .overlay p b { color: #e8ecf4; }
  .btn {
    display: inline-block;
    padding: 14px 52px;
    font-size: 20px;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: #0b0e14;
    background: linear-gradient(135deg, #ffd34d, #ff9d3c);
    border: none; border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 0 24px rgba(255, 170, 60, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(255, 170, 60, 0.55); }
  .btn:active { transform: translateY(1px); }
  #finalScore { font-size: 42px; color: #ffd34d; margin: 6px 0 22px; font-weight: 800; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px;
    z-index: 5; pointer-events: none;
    color: #e8ecf4;
  }
  #hud.hidden { display: none; }
  #hpWrap {
    width: min(240px, 38vw); height: 14px;
    background: rgba(255,255,255,0.12);
    border-radius: 7px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.18);
  }
  #hpBar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff5a5a, #ffb84d);
    transition: width 0.15s ease;
  }
  #scoreBox { font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-align: right; }
  #scoreBox span { color: #ffd34d; font-size: 24px; }
  #waveBox { font-size: 13px; color: #9aa4b8; margin-top: 2px; }

  /* 右上 HUD 容器 — flex 垂直堆疊,避免重疊 */
  #rightHud {
    position: fixed;
    top: 14px; right: 18px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    z-index: 5;
    pointer-events: none;
    max-width: 60vw;
  }
  /* 升級標籤 (右上角堆疊) */
  .upgrade-tag {
    font-size: 12px; font-weight: 700;
    color: #ffd34d;
    background: rgba(255, 170, 60, 0.18);
    border: 1px solid rgba(255, 211, 77, 0.5);
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 0.1em;
    pointer-events: none;
    display: none;
    white-space: nowrap;
  }
  .upgrade-tag.show {
    display: block;
    animation: tagPulse 1.4s ease-in-out infinite;
  }
  #shieldTag.show { color: #6bd4ff; border-color: rgba(107, 212, 255, 0.5); background: rgba(107, 212, 255, 0.12); }
  #droneTag.show  { color: #a4ff6b; border-color: rgba(164, 255, 107, 0.5); background: rgba(164, 255, 107, 0.12); }
  #teammateTag.show { color: #a4ff6b; border-color: rgba(255, 200, 60, 0.5); background: rgba(255, 200, 60, 0.12); }
  /* 機槍班裝備員 黃色 */
  #goldWeaponTag {
    font-size: 12px; font-weight: 700;
    color: #ffd34d;
    background: rgba(255, 220, 100, 0.15);
    border: 1px solid rgba(255, 220, 100, 0.6);
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 0.1em;
    pointer-events: none;
    display: none;
    white-space: nowrap;
    animation: goldPulse 1.2s ease-in-out infinite;
  }
  @keyframes tagPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255, 170, 60, 0.3); }
    50% { box-shadow: 0 0 16px rgba(255, 170, 60, 0.7); }
  }
  /* 角色面板 (左上) */
  .char-panel {
    position: fixed; top: 14px; left: 14px;
    background: linear-gradient(180deg, rgba(40, 24, 24, 0.85), rgba(20, 12, 12, 0.92));
    border: 1px solid rgba(180, 50, 50, 0.4);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    z-index: 6;
    pointer-events: none;
  }
  #charAvatar {
    background: linear-gradient(135deg, #3a2a2a, #1a0a0a);
    border-radius: 6px;
    border: 1px solid #5a3a3a;
  }
  .char-info { display: flex; flex-direction: column; gap: 2px; min-width: 140px; }
  .char-stats {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #e8ecf4; font-weight: 700;
  }
  .char-icon { font-size: 13px; }
  .char-hp-text { color: #ff6b6b; min-width: 56px; }
  .char-lv {
    margin-left: auto;
    color: #ffd34d;
    background: rgba(255, 211, 77, 0.15);
    border: 1px solid rgba(255, 211, 77, 0.5);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
  }
  .hp-bar, .exp-bar {
    width: 140px; height: 6px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .hp-bar { height: 8px; }
  #charHpBar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff3030, #ff8030, #ffd34d);
    transition: width 0.2s ease;
  }
  #charExpBar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #8a4aff, #c080ff);
    transition: width 0.3s ease;
  }

  /* 進化卡片 (右上) */
  .evo-card {
    width: 200px;
    background: linear-gradient(180deg, rgba(40, 30, 20, 0.92), rgba(20, 14, 8, 0.95));
    border: 1px solid rgba(255, 200, 100, 0.5);
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  .evo-title {
    font-size: 12px; font-weight: 700; color: #ffd34d;
    letter-spacing: 1px; margin-bottom: 6px;
    border-bottom: 1px solid rgba(255, 200, 100, 0.3);
    padding-bottom: 4px;
  }
  .evo-body { display: flex; gap: 8px; align-items: center; }
  #evoAvatar {
    background: linear-gradient(135deg, #3a2a1a, #1a0a08);
    border-radius: 6px;
    border: 1px solid #5a3a1a;
    flex-shrink: 0;
  }
  .evo-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .evo-label { font-size: 10px; color: #e8c898; line-height: 1.3; }
  .evo-progress { font-size: 10px; color: #9aa4b8; }
  .evo-stars { font-size: 11px; color: #ffd34d; letter-spacing: 1px; }

  /* 音訊開關按鈕 */
  #audioBtn {
    position: fixed; top: 14px; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    width: 44px; height: 44px;
    font-size: 20px;
    border-radius: 50%;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: transform 0.15s ease, background 0.15s ease;
    display: flex; align-items: center; justify-content: center;
  }
  #audioBtn:hover { background: rgba(255, 255, 255, 0.15); transform: translateX(-50%) scale(1.08); }
  #audioBtn:active { transform: translateX(-50%) scale(0.95); }
  #scoreBox { color: #e8ecf4; font-size: 14px; font-weight: 700; text-align: right; }
  #goldWeaponTag.show { display: block; }
  @keyframes goldPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255, 220, 100, 0.4); }
    50% { box-shadow: 0 0 20px rgba(255, 220, 100, 0.9); }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<button id="audioBtn" title="音效開/關">🔊</button>

<div id="hud" class="hidden">
  <div class="char-panel" id="charPanel">
    <canvas id="charAvatar" width="56" height="56"></canvas>
    <div class="char-info">
      <div class="char-stats">
        <span class="char-icon">❤️</span>
        <span id="charHpText" class="char-hp-text">100/100</span>
        <span class="char-lv">Lv.<span id="charLv">1</span></span>
      </div>
      <div class="hp-bar"><div id="charHpBar"></div></div>
      <div class="exp-bar"><div id="charExpBar"></div></div>
    </div>
  </div>

  <div class="evo-card" id="evoCard">
    <div class="evo-title">⚔️ 下次進化</div>
    <div class="evo-body">
      <canvas id="evoAvatar" width="48" height="48"></canvas>
      <div class="evo-info">
        <div class="evo-label" id="evoLabel">擊敗 5 隻灰暗屍靈</div>
        <div class="evo-progress"><span id="evoNow">0</span>/<span id="evoMax">5</span></div>
        <div class="evo-stars" id="evoStars">★★☆☆☆</div>
      </div>
    </div>
  </div>
  <div id="rightHud">
    <div id="scoreBox">
      得分 <span id="score" style="color:#ffd34d;font-size:18px;">0</span>
      <div id="waveBox" style="font-size:11px;color:#9aa4b8;margin-top:2px;">第 1 波</div>
    </div>
    <div id="dualTag" class="upgrade-tag">⚡ 雙槍模式</div>
    <div id="shieldTag" class="upgrade-tag">🛡 防護罩掉落</div>
    <div id="droneTag" class="upgrade-tag">🛸 無人機×<span id="droneCount">0</span></div>
    <div id="teammateTag" class="upgrade-tag">🪖 機槍班 (<span id="teammateCount">60</span>s)</div>
    <div id="goldWeaponTag">✨ <span id="goldWeaponName">GOLDEN</span> 武器</div>
  </div>
</div>

<div id="menu" class="overlay">
  <h1>叢林槍戰突圍</h1>
  <p>
    <b>WASD / 方向鍵</b> 移動 ・ <b>滑鼠</b> 瞄準 ・ <b>左鍵 / 空白鍵</b> 射擊<br>
    手機：<b>左半邊拖曳</b> 移動，<b>點右半邊</b> 朝該方向射擊<br>
    <span style="color:#6bd4ff">第 5 波</span> 防護罩掉落 ・ <span style="color:#a4ff6b">第 7 波</span> 無人機 ・ <span style="color:#ffd34d">第 9 波</span> 雙無人機<br>
    <span style="color:#c8ff60">第 11 波</span> 召喚機槍班 (60s) 支援<br>
    撐越久越強！
  </p>
  <button class="btn" id="startBtn">開始遊戲</button>
</div>

<div id="gameover" class="overlay hidden">
  <h1 style="color:#ff6b6b;text-shadow:0 0 24px rgba(255,107,107,.45)">任務失敗</h1>
  <div id="finalScore">0</div>
  <button class="btn" id="retryBtn">再來一次</button>
</div>

<script>
(function () {
  "use strict";

  // ===== Canvas 設定 =====
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  var menuEl = document.getElementById("menu");
  var overEl = document.getElementById("gameover");
  var hudEl = document.getElementById("hud");
  var scoreEl = document.getElementById("score");
  // 舊版 HUD 使用 #hpBar；目前角色面板使用 #charHpBar，保留相容 fallback
  var hpBarEl = document.getElementById("hpBar") || document.getElementById("charHpBar");
  var waveEl = document.getElementById("waveBox");
  var finalScoreEl = document.getElementById("finalScore");
  var dualTagEl = document.getElementById("dualTag");
  var shieldTagEl = document.getElementById("shieldTag");
  var droneTagEl = document.getElementById("droneTag");
  var droneCountEl = document.getElementById("droneCount");
  var teammateTagEl = document.getElementById("teammateTag");
  var teammateCountEl = document.getElementById("teammateCount");
  var goldWeaponTagEl = document.getElementById("goldWeaponTag");
  var goldWeaponNameEl = document.getElementById("goldWeaponName");

  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  var ISO_Y_SCALE = 0.55;

  var STATE = { MENU: 0, PLAY: 1, OVER: 2 };
  var state = STATE.MENU;

  var player, bullets, enemies, particles, pickups, drones, missiles, explosions, aiTeammates, scenery, bosses, goldWeapons, teammates, snowParticles;
  var score, wave, spawnTimer, waveTimer, shake, flash, aiSupportTimer;
  var lastTime = 0, gameTime = 0;

  var keys = {};
  var mouse = { x: W / 2, y: H / 2, down: false };
  var touchMove = null;
  var touchFire = null;

  var _prevPx = 0, _prevPy = 0;

  // ===== 升級里程碑 =====
  var UNLOCK = { DUAL_WAVE: 3, SHIELD_WAVE: 5, DRONE1_WAVE: 5, TEAMMATE_WAVE: 11, BOSS_WAVE: 13 };

  // ===== 音訊系統 (Web Audio API, 純程式生成) =====
  var audioCtx = null;
  var audioEnabled = true;
  var bgmGain = null;
  var bgmInterval = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      bgmGain = audioCtx.createGain();
      bgmGain.gain.value = 0.08;  // BGM 音量較低
      bgmGain.connect(audioCtx.destination);
    } catch (e) {
      audioEnabled = false;
      console.warn("Audio not supported:", e);
    }
  }

  function playShoot() {
    if (!audioEnabled || !audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(80, t + 0.08);
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.1);
  }

  function playExplosion() {
    if (!audioEnabled || !audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t = audioCtx.currentTime;
    // 噪音緩衝 (白噪音)
    var bufferSize = audioCtx.sampleRate * 0.3;
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    var noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 800;
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.25, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(t);
    noise.stop(t + 0.3);
    // 低頻轟鳴
    var osc = audioCtx.createOscillator();
    var og = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.2);
    og.gain.setValueAtTime(0.2, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    osc.connect(og);
    og.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.25);
  }

  function playPickup() {
    if (!audioEnabled || !audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(800, t);
    osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  function playGold() {
    if (!audioEnabled || !audioCtx) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t = audioCtx.currentTime;
    // 三音和弦 (C-E-G 上行)
    var notes = [523, 659, 784];
    for (var i = 0; i < notes.length; i++) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = notes[i];
      var startT = t + i * 0.08;
      gain.gain.setValueAtTime(0.18, startT);
      gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startT);
      osc.stop(startT + 0.4);
    }
  }

  function startBGM() {
    if (!audioEnabled || !audioCtx || bgmInterval) return;
    if (audioCtx.state === "suspended") audioCtx.resume();
    var bpm = 90;
    var beatTime = 60 / bpm;
    var noteIdx = 0;
    // 簡單低音旋律 (C minor)
    var pattern = [130, 130, 196, 130, 146, 130, 174, 130];
    function tickNote() {
      if (!audioEnabled || !audioCtx || !bgmGain) return;
      var freq = pattern[noteIdx % pattern.length];
      var t = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.06, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + beatTime * 0.8);
      osc.connect(gain);
      gain.connect(bgmGain);
      osc.start(t);
      osc.stop(t + beatTime * 0.9);
      // 第二拍加踢鼓 (低頻噪音)
      if (noteIdx % 2 === 0) {
        var kickBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
        var kd = kickBuf.getChannelData(0);
        for (var i = 0; i < kd.length; i++) kd[i] = (Math.random() * 2 - 1) * (1 - i / kd.length);
        var ks = audioCtx.createBufferSource();
        ks.buffer = kickBuf;
        var kf = audioCtx.createBiquadFilter();
        kf.type = "lowpass";
        kf.frequency.value = 150;
        var kg = audioCtx.createGain();
        kg.gain.setValueAtTime(0.08, t);
        kg.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        ks.connect(kf); kf.connect(kg); kg.connect(bgmGain);
        ks.start(t); ks.stop(t + 0.1);
      }
      noteIdx++;
    }
    bgmInterval = setInterval(tickNote, beatTime * 1000);
  }

  function stopBGM() {
    if (bgmInterval) {
      clearInterval(bgmInterval);
      bgmInterval = null;
    }
  }

  function toggleAudio() {
    if (!audioCtx) {
      initAudio();
      startBGM();
      audioEnabled = true;
    } else {
      audioEnabled = !audioEnabled;
      if (audioEnabled) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        startBGM();
      } else {
        stopBGM();
      }
    }
    updateAudioBtn();
  }

  function updateAudioBtn() {
    var btn = document.getElementById("audioBtn");
    if (btn) btn.textContent = audioEnabled ? "🔊" : "🔇";
  }

  function resetGame() {
    player = {
      x: W / 2, y: H / 2,
      r: 14,
      speed: 260,
      hp: 100, maxHp: 100,
      exp: 0, level: 1, expToNext: 100,
      angle: 0,
      facing: 0,
      fireCd: 0, fireRate: 0.16,
      fireCd2: 0, fireRate2: 0.14,
      inv: 0,
      dual: false, dualUnlocked: false,
      shield: { active: false, time: 0, max: 10 },  // 防護罩
      bodyH: 38, bodyW: 22, headR: 9, legLen: 14, armLen: 13,
      gunLen: 26, gunThick: 4, shadowR: 18
    };
    bullets = [];
    enemies = [];
    particles = [];
    pickups = [];
    drones = [];
    missiles = [];
    explosions = [];
    aiTeammates = [];
    aiSupportTimer = 0;
    scenery = [];
    bosses = [];
    goldWeapons = null;
    teammates = [];
    snowParticles = [];
    killsThisWave = 0;
    evoGoal = 5 + Math.floor(wave * 0.5);
    score = 0;
    wave = 1;
    spawnTimer = 0;
    waveTimer = 0;
    shake = 0;
    flash = 0;
    gameTime = 0;
    _prevPx = player.x;
    _prevPy = player.y;

  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < W / 2 && !touchMove) {
        touchMove = { id: t.identifier, sx: t.clientX, sy: t.clientY, dx: 0, dy: 0 };
      } else if (!touchFire) {
        touchFire = { id: t.identifier, x: t.clientX, y: t.clientY };
        mouse.x = t.clientX; mouse.y = t.clientY; mouse.down = true;
      }
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (touchMove && t.identifier === touchMove.id) {
        var dx = t.clientX - touchMove.sx, dy = t.clientY - touchMove.sy;
        var len = Math.hypot(dx, dy), max = 60;
        if (len > max) { dx = dx / len * max; dy = dy / len * max; }
        touchMove.dx = dx / max; touchMove.dy = dy / max;
      }
      if (touchFire && t.identifier === touchFire.id) {
        touchFire.x = t.clientX; touchFire.y = t.clientY;
        mouse.x = t.clientX; mouse.y = t.clientY;
      }
    }
  }, { passive: false });

  function endTouch(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (touchMove && t.identifier === touchMove.id) touchMove = null;
      if (touchFire && t.identifier === touchFire.id) { touchFire = null; mouse.down = false; }
    }
  }
  canvas.addEventListener("touchend", endTouch, { passive: false });
  canvas.addEventListener("touchcancel", endTouch, { passive: false });

  // ===== 工具函式 =====
  function fillCylinder(cx, cy, w, h, lightColor, midColor, shadowColor) {
    ctx.fillStyle = midColor;
    ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
    ctx.fillStyle = lightColor;
    ctx.fillRect(cx - w / 2, cy - h / 2, w, h * 0.25);
    ctx.fillStyle = shadowColor;
    ctx.fillRect(cx - w / 2, cy + h / 2 - h * 0.25, w, h * 0.25);
  }
  function fillSphere(cx, cy, r, lightColor, midColor, shadowColor, hlOffsetX, hlOffsetY, hlR) {
    ctx.fillStyle = shadowColor;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = midColor;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lightColor;
    ctx.beginPath();
    ctx.arc(cx + (hlOffsetX || 0), cy + (hlOffsetY || 0), hlR || r * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // ===== 武器繪製 (共用) =====
  function drawWeapon(type, gunBaseX, gunBaseY, gunLen, gunThick, palette) {
    var c = palette.gun;
    var hl = palette.gunHighlight;
    var sh = palette.gunShadow || "#0a0a0a";
    var wood = palette.gunWood;

    ctx.save();
    ctx.translate(gunBaseX, gunBaseY);

    if (type === "rifle" || type === "ak") {
      ctx.fillStyle = wood || "#5a3818";
      ctx.fillRect(-gunLen * 0.25, -gunThick * 0.8, gunLen * 0.22, gunThick * 1.6);
      ctx.fillStyle = "#7a5028";
      ctx.fillRect(-gunLen * 0.25, -gunThick * 0.8, gunLen * 0.22, gunThick * 0.3);
      ctx.fillStyle = sh;
      ctx.fillRect(-gunLen * 0.05, -gunThick * 0.95, gunLen * 0.30, gunThick * 1.9);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.05, -gunThick * 0.85, gunLen * 0.30, gunThick * 1.7);
      ctx.fillStyle = hl;
      ctx.fillRect(-gunLen * 0.05, -gunThick * 0.85, gunLen * 0.30, gunThick * 0.25);
      ctx.fillStyle = sh;
      ctx.fillRect(gunLen * 0.02, -gunThick * 1.1, gunLen * 0.10, gunThick * 0.3);
      ctx.fillStyle = sh;
      ctx.fillRect(gunLen * 0.22, -gunThick * 1.15, gunThick * 0.6, gunThick * 0.5);
      ctx.fillStyle = hl;
      ctx.fillRect(gunLen * 0.22, -gunThick * 1.15, gunThick * 0.4, 1);
      fillCylinder(gunLen * 0.4, 0, gunLen * 0.35, gunThick * 0.9, hl, c, sh);
      ctx.fillStyle = sh;
      ctx.fillRect(gunLen * 0.75, -gunThick * 0.6, gunLen * 0.06, gunThick * 1.2);
      ctx.fillStyle = sh;
      ctx.fillRect(-gunLen * 0.05, gunThick * 0.95, gunThick * 1.4, gunLen * 0.18);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.05, gunThick * 0.95, gunThick * 1.4, gunLen * 0.15);
      ctx.fillStyle = sh;
      for (var i = 0; i < 3; i++) {
        ctx.fillRect(-gunLen * 0.05, gunThick * 1.05 + i * 2, gunThick * 1.4, 0.5);
      }
      ctx.fillStyle = sh;
      ctx.fillRect(-gunLen * 0.05, gunThick * 1.1 + gunLen * 0.15, gunThick * 1.3, gunThick * 0.3);
      ctx.fillStyle = sh;
      ctx.fillRect(-gunLen * 0.18, gunThick * 0.9, gunThick * 1.0, gunLen * 0.10);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.18, gunThick * 0.9, gunThick * 1.0, gunLen * 0.08);
      ctx.fillStyle = sh;
      for (var j = 0; j < 3; j++) {
        ctx.fillRect(-gunLen * 0.18 + j * 1.5, gunThick * 0.95, 0.5, gunLen * 0.07);
      }
    } else if (type === "smg") {
      ctx.fillStyle = sh;
      ctx.fillRect(-gunLen * 0.18, -gunThick * 0.4, gunLen * 0.16, gunThick * 0.8);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.04, -gunThick * 0.85, gunLen * 0.32, gunThick * 1.7);
      ctx.fillStyle = hl;
      ctx.fillRect(-gunLen * 0.04, -gunThick * 0.85, gunLen * 0.32, gunThick * 0.25);
      fillCylinder(gunLen * 0.36, 0, gunLen * 0.36, gunThick * 0.7, hl, c, sh);
      ctx.fillStyle = sh;
      ctx.fillRect(gunLen * 0.72, -gunThick * 0.5, gunLen * 0.05, gunThick);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.05, gunThick * 0.95, gunThick * 0.9, gunLen * 0.13);
      ctx.fillStyle = sh;
      ctx.fillRect(-gunLen * 0.05, gunThick * 0.95, gunThick * 0.9, 0.8);
      ctx.fillStyle = c;
      ctx.fillRect(gunLen * 0.18, gunThick * 0.95, gunThick * 0.7, gunLen * 0.08);
    } else if (type === "pistol") {
      ctx.fillStyle = sh;
      ctx.fillRect(-gunLen * 0.08, -gunThick * 0.4, gunLen * 0.14, gunThick * 1.8);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.08, -gunThick * 0.4, gunLen * 0.14, gunThick * 1.6);
      ctx.fillStyle = hl;
      ctx.fillRect(-gunLen * 0.08, -gunThick * 0.4, gunLen * 0.14, 0.6);
      fillCylinder(gunLen * 0.25, -gunThick * 0.25, gunLen * 0.5, gunThick * 0.6, hl, c, sh);
      ctx.fillStyle = hl;
      ctx.fillRect(gunLen * 0.45, -gunThick * 0.55, 0.6, 1);
    } else if (type === "shotgun") {
      ctx.fillStyle = wood || "#5a3818";
      ctx.fillRect(-gunLen * 0.30, -gunThick * 0.9, gunLen * 0.22, gunThick * 1.8);
      ctx.fillStyle = "#7a5028";
      ctx.fillRect(-gunLen * 0.30, -gunThick * 0.9, gunLen * 0.22, gunThick * 0.3);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.10, -gunThick * 1.0, gunLen * 0.22, gunThick * 2.0);
      ctx.fillStyle = hl;
      ctx.fillRect(-gunLen * 0.10, -gunThick * 1.0, gunLen * 0.22, 0.4);
      fillCylinder(gunLen * 0.35, 0, gunLen * 0.45, gunThick * 1.1, hl, c, sh);
      ctx.fillStyle = sh;
      ctx.fillRect(gunLen * 0.20, -gunThick * 0.7, 1.5, gunThick * 1.4);
      ctx.fillRect(gunLen * 0.55, -gunThick * 0.7, 1.5, gunThick * 1.4);
    } else if (type === "mg") {
      ctx.fillStyle = sh;
      ctx.fillRect(-gunLen * 0.30, -gunThick * 0.7, gunLen * 0.20, gunThick * 1.4);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.30, -gunThick * 0.7, gunLen * 0.20, gunThick * 1.2);
      ctx.fillStyle = c;
      ctx.fillRect(-gunLen * 0.12, -gunThick * 0.85, gunLen * 0.24, gunThick * 1.7);
      ctx.fillStyle = hl;
      ctx.fillRect(-gunLen * 0.12, -gunThick * 0.85, gunLen * 0.24, 0.5);
      fillCylinder(gunLen * 0.32, 0, gunLen * 0.30, gunThick * 1.0, hl, c, sh);
      ctx.fillStyle = sh;
      ctx.fillRect(gunLen * 0.62, -gunThick * 0.7, gunLen * 0.06, gunThick * 1.4);
      fillSphere(0, gunThick * 1.4, gunThick * 1.5, "#3a3a3a", "#1a1a1a", "#0a0a0a", -1, -1, 1.5);
      ctx.fillStyle = "#2a2a2a";
      for (var k = 0; k < 4; k++) {
        ctx.fillRect(-gunLen * 0.05 + k * 1.2, gunThick * 1.5, 1, 1.5);
      }
    } else {
      ctx.fillStyle = palette.gunStock || "#3a3a3a";
      ctx.fillRect(-2, -gunThick * 0.7, 4, gunThick * 1.4);
      ctx.fillStyle = palette.gun;
      ctx.fillRect(2, -gunThick * 0.5, gunLen, gunThick);
      ctx.fillRect(gunLen, -gunThick * 0.7, 2, gunThick * 1.4);
      ctx.fillRect(gunLen * 0.6, -gunThick * 0.5 - 2, 1.5, 2);
      ctx.fillStyle = palette.gunHighlight;
      ctx.fillRect(2, -gunThick * 0.5 + 0.5, gunLen, 0.8);
    }
    ctx.restore();
  }

  // ===== 動畫關節點 =====
  function calcJointSwing(phase, isMoving) {
    if (!isMoving) return { shoulder: 0, elbow: 0, hip: 0, knee: 0 };
    var s = Math.sin(phase * 1.4);
    var c = Math.cos(phase * 1.4);
    return {
      shoulder: s * 0.3,
      elbow: 0.15 + Math.max(0, c) * 0.1,
      hip: s * 0.25,
      knee: 0.2 + Math.max(0, -c) * 0.3
    };
  }

  // ===== 遊戲邏輯 =====
  function spawnEnemy() {
    var side = Math.floor(Math.random() * 4);
    var x, y;
    if (side === 0) { x = -30; y = Math.random() * H; }
    else if (side === 1) { x = W + 30; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = -30; }
    else { x = Math.random() * W; y = H + 30; }

    var typeRoll = Math.random();
    var e;
    if (wave >= 3 && typeRoll < 0.15) {
      e = { type: "heavy", r: 22, hp: 60 + wave * 8, speed: 55 + wave * 2, color: "#c14bff",
            dmg: 25, score: 30, scale: 1.35, weapon: "mg" };
    } else if (wave >= 2 && typeRoll < 0.4) {
      e = { type: "fast", r: 11, hp: 12 + wave * 2, speed: 170 + wave * 6, color: "#ffb84d",
            dmg: 8, score: 15, scale: 0.85, weapon: "pistol" };
    } else {
      e = { type: "normal", r: 14, hp: 24 + wave * 4, speed: 95 + wave * 4, color: "#ff5a5a",
            dmg: 15, score: 10, scale: 1.0, weapon: "smg" };
    }
    e.x = x; e.y = y; e.maxHp = e.hp; e.hitFlash = 0;
    e._lastX = x; e._lastY = y;
    e._animPhase = Math.random() * Math.PI * 2;
    e.facing = Math.floor(Math.random() * 4);
    enemies.push(e);
  }

  function shoot() {
    var a = player.angle;
    var spread = (Math.random() - 0.5) * 0.06;
    var gunTipDist = player.bodyW * 0.3 + player.gunLen;
    var gunTipX = player.x + Math.cos(a) * gunTipDist;
    var gunTipY = player.y + Math.sin(a) * gunTipDist;
    var bulletSpeed = 640;
    var bulletDmg = 14;
    // 金色武器加成
    if (goldWeapons === "crimson_rifle") bulletDmg = 21;  // +50% 攻擊
    if (goldWeapons === "platinum_pistol") bulletSpeed = 960; // +50% 射程/速度
    if (goldWeapons === "golden_launcher") bulletSpeed = 480; // 慢但 AoE
    bullets.push({
      x: gunTipX, y: gunTipY, z: 14,
      vx: Math.cos(a + spread) * bulletSpeed,
      vy: Math.sin(a + spread) * bulletSpeed,
      vz: 0,
      r: goldWeapons === "golden_launcher" ? 7 : 4,
      dmg: bulletDmg,
      life: 1.2, rot: 0,
      gold: !!goldWeapons,
      goldType: goldWeapons
    });
    for (var i = 0; i < 3; i++) {
      particles.push({
        x: gunTipX + Math.cos(a) * 4, y: gunTipY + Math.sin(a) * 4,
        vx: Math.cos(a + (Math.random() - 0.5)) * 120,
        vy: Math.sin(a + (Math.random() - 0.5)) * 120,
        r: 2 + Math.random() * 2, life: 0.12, maxLife: 0.12, color: "#ffd34d"
      });
    }
    playShoot();
  }
  function shootSecondary() {
    var a = player.angle;
    var spread = (Math.random() - 0.5) * 0.08;
    var gunTipDist = player.bodyW * 0.3 + player.gunLen;
    var perpX = -Math.sin(a) * 6;
    var perpY = Math.cos(a) * 6;
    var gunTipX = player.x + Math.cos(a) * gunTipDist + perpX;
    var gunTipY = player.y + Math.sin(a) * gunTipDist + perpY;
    bullets.push({
      x: gunTipX, y: gunTipY, z: 14,
      vx: Math.cos(a + spread) * 640, vy: Math.sin(a + spread) * 640, vz: 0,
      r: 4, life: 1.2, rot: 0
    });
    for (var i = 0; i < 3; i++) {
      particles.push({
        x: gunTipX + Math.cos(a) * 4, y: gunTipY + Math.sin(a) * 4,
        vx: Math.cos(a + (Math.random() - 0.5)) * 120,
        vy: Math.sin(a + (Math.random() - 0.5)) * 120,
        r: 2 + Math.random() * 2, life: 0.12, maxLife: 0.12, color: "#ffd34d"
      });
    }
    playShoot();

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,

  function updateHud() {

    var charHpBar = document.getElementById("charHpBar");
    if (charHpBar) charHpBar.style.width = Math.max(0, player.hp / player.maxHp * 100) + "%";
    var charExpBar = document.getElementById("charExpBar");
    if (charExpBar) charExpBar.style.width = Math.max(0, player.exp / player.expToNext * 100) + "%";
    var charLv = document.getElementById("charLv");

  // ===== 角色頭像 (骷髏) =====
  function drawCharAvatar() {
    var cv = document.getElementById("charAvatar");
    if (!cv) return;
    var c = cv.getContext("2d");
    c.clearRect(0, 0, 56, 56);
    // 背景
    var bgGrad = c.createLinearGradient(0, 0, 0, 56);
    bgGrad.addColorStop(0, "#3a2a2a");
    bgGrad.addColorStop(1, "#1a0a0a");
    c.fillStyle = bgGrad;
    c.fillRect(0, 0, 56, 56);
    // 骷髏 (圓頭 + 眼窩 + 嘴)
    c.fillStyle = "#e8d8c0";
    c.beginPath();
    c.arc(28, 24, 16, 0, Math.PI * 2);
    c.fill();
    // 下顎
    c.fillRect(20, 36, 16, 8);
    // 牙齒
    c.fillStyle = "#1a0a0a";
    for (var t = 0; t < 4; t++) {
      c.fillRect(22 + t * 3, 38, 1, 4);
    }
    // 眼窩 (大紅眼)
    c.fillStyle = "#aa1010";
    c.beginPath();
    c.arc(23, 24, 4, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.arc(33, 24, 4, 0, Math.PI * 2);
    c.fill();
    // 眼窩黑邊
    c.fillStyle = "#000";
    c.beginPath();
    c.arc(23, 24, 2.5, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.arc(33, 24, 2.5, 0, Math.PI * 2);
    c.fill();
    // 紅眼高光
    c.fillStyle = "#ff5050";
    c.beginPath();
    c.arc(23, 24, 1, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.arc(33, 24, 1, 0, Math.PI * 2);
    c.fill();
    // 鼻孔
    c.fillStyle = "#1a0a0a";
    c.beginPath();
    c.moveTo(28, 30);
    c.lineTo(26, 34);
    c.lineTo(30, 34);
    c.closePath();
    c.fill();
    // 紅頭巾 (頂部)
    c.fillStyle = "#aa3030";
    c.fillRect(14, 10, 28, 6);
    c.fillRect(12, 14, 32, 4);
  }

  // ===== 進化頭像 (木乃伊/骷髏戰士) =====
  function drawEvoAvatar() {
    var cv = document.getElementById("evoAvatar");
    if (!cv) return;
    var c = cv.getContext("2d");
    c.clearRect(0, 0, 48, 48);
    // 背景
    var bgGrad = c.createLinearGradient(0, 0, 0, 48);
    bgGrad.addColorStop(0, "#3a2a1a");
    bgGrad.addColorStop(1, "#1a0a08");
    c.fillStyle = bgGrad;
    c.fillRect(0, 0, 48, 48);
    // 木乃伊纏繃帶
    c.fillStyle = "#d4c4a8";
    c.beginPath();
    c.arc(24, 20, 13, 0, Math.PI * 2);
    c.fill();
    // 繃帶紋路
    c.strokeStyle = "#9a8a6e";
    c.lineWidth = 1;
    for (var b = 0; b < 4; b++) {
      c.beginPath();
      c.moveTo(12, 14 + b * 5);
      c.lineTo(36, 14 + b * 5);
      c.stroke();
    }
    // 眼睛縫隙 (深紅光)
    c.fillStyle = "#aa2020";
    c.fillRect(19, 18, 4, 2);
    c.fillRect(25, 18, 4, 2);
    // 盾牌 (右下小圖示)
    c.fillStyle = "#7a5a2a";
    c.beginPath();
    c.arc(34, 36, 4, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = "#ffd34d";
    c.lineWidth = 1;
    c.beginPath();
    c.arc(34, 36, 4, 0, Math.PI * 2);
    c.stroke();
    c.fillStyle = "#ffd34d";
    c.fillRect(33, 36, 2, 2);
  }

  // 升級計數 (擊殺累積)
  var killsThisWave = 0;
  var evoGoal = 5;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function angleToFacing(angle) {
    var a = angle;
    while (a < 0) a += Math.PI * 2;
    while (a >= Math.PI * 2) a -= Math.PI * 2;
    var step = Math.PI / 2;
    return Math.floor((a + step / 2) / step) % 4;
  }

  // ===== 升級解鎖 =====
  function unlockWave(w) {
    if (w >= UNLOCK.DUAL_WAVE && !player.dualUnlocked) {
      player.dual = true; player.dualUnlocked = true;
      if (dualTagEl) dualTagEl.classList.add("show");
      burst(player.x, player.y, "#ffd34d", 24);
      flash = 0.3;
    }
    if (w >= UNLOCK.SHIELD_WAVE) {
      if (shieldTagEl) shieldTagEl.classList.add("show");
    }
    if (w >= UNLOCK.DRONE1_WAVE) {
      if (droneTagEl) droneTagEl.classList.add("show");
    }
    // 每 5 波召喚 1 台無人機 (5/10/15/...) — 取消舊的 wave 7/9 固定 2 台上限
    if (w >= 5 && w % 5 === 0) {
      spawnDrone(drones.length);
      if (droneCountEl) droneCountEl.textContent = drones.length;
    }
    if (w >= UNLOCK.TEAMMATE_WAVE && w === UNLOCK.TEAMMATE_WAVE) {
      spawnTeammates();
    }
    // 7/9 波召喚 MG 隊員 (無敵)
    if (w === 7 || w === 9) {
      spawnMgTeammate();
    } else if (w >= 3 && w % 3 === 0) {
      // 其餘每 3 波召喚 1 名隨機隊友 (3/6/12/15/...)
      spawnTeammateRandom();
    }
  }

  function spawnDruneDroneId(idx) {
    // 環形編隊: 多機均分 360°
    var phaseOffset = idx * (Math.PI * 2 / Math.max(drones.length + 1, 2));
    drones.push({
      angle: phaseOffset,                  // 環形位置 (相對玩家)
      orbitRadius: 100 + (idx * 4),        // 不同無人機半徑略不同
      bobAmp: 6 + idx * 2,                 // 飄動幅度
      bobFreq: 1.5 + idx * 0.3,            // 飄動頻率
      x: player.x, y: player.y,
      targetEnemy: null,
      fireCd: 0, fireRate: 1.4,            // 每 1.4 秒發射一次
      spin: 0                              // 旋翼動畫
    });
  }
  // alias
  function spawnDrone(idx) { spawnDruneDroneId(idx); }

  // ===== BOSS 生成 =====
  // 3 種類型: tank(裝甲)、heavy(重火力)、spitter(刺蛇)
  function spawnBoss() {
    var types = ["tank", "heavy", "spitter"];
    var type = types[Math.floor(Math.random() * 3)];
    var boss;
    // 從畫面外生成,確保玩家能看到它走進來
    var side = Math.floor(Math.random() * 4);
    var x, y;
    if (side === 0) { x = -60; y = Math.random() * H; }
    else if (side === 1) { x = W + 60; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = -60; }
    else { x = Math.random() * W; y = H + 60; }

    if (type === "tank") {
      boss = {
        type: "tank", r: 32, hp: 2000, maxHp: 2000,
        speed: 50 + wave * 1, scale: 1.6,
        weapon: "mg", color: "#888", score: 50,
        dmg: 35,
        armor: 0.3,  // 30% 傷害減免
        fireCd: 0, fireRate: 0.3,
        viewRange: 500
      };
    } else if (type === "heavy") {
      boss = {
        type: "heavy", r: 36, hp: 3000, maxHp: 3000,
        speed: 35 + wave * 0.5, scale: 1.8,
        weapon: "shotgun", color: "#5a2a6a", score: 50,
        dmg: 50,
        armor: 0.2,
        fireCd: 0, fireRate: 1.2,
        viewRange: 450,
        burstCount: 3  // 一次 3 發
      };
    } else { // spitter
      boss = {
        type: "spitter", r: 28, hp: 1500, maxHp: 1500,
        speed: 65 + wave * 1.2, scale: 1.7,
        weapon: "spit", color: "#3a8a3a", score: 50,
        dmg: 20,
        armor: 0,
        fireCd: 0, fireRate: 1.5,
        viewRange: 350,
        spitRadius: 80  // AoE
      };
    }
    boss.x = x; boss.y = y; boss.hitFlash = 0;
    boss._lastX = x; boss._lastY = y;
    boss._animPhase = Math.random() * Math.PI * 2;
    boss.facing = Math.floor(Math.random() * 4);
    bosses.push(boss);
  }

  function spawnTeammateRandom() {
    // 隨機選一種
    var typeKeys = Object.keys(TEAMMATE_TYPES);
    var typeName = typeKeys[Math.floor(Math.random() * typeKeys.length)];
    spawnTeammateByType(typeName);

  // 7/9 波召喚 MG 隊員 (無敵) — 強制 machinegun 類型
  function spawnMgTeammate() {
    spawnTeammateByType("machinegun");
  }

  function spawnTeammateByType(typeName) {
    var def = TEAMMATE_TYPES[typeName] || TEAMMATE_TYPES.machinegun;
    var off = def.followOffset;
    teammates.push({
      type: typeName,
      x: clamp(player.x + off.x, 30, W - 30),
      y: clamp(player.y + off.y, 30, H - 30),
      hp: def.hp, maxHp: def.hp,
      fireCd: Math.random() * 0.5,
      fireRate: def.fireRate,
      viewRange: def.range || 350,
      target: null,
      def: def,
      bobPhase: Math.random() * Math.PI * 2,
      facing: 0
    });
    burst(player.x + off.x, player.y + off.y, def.labelColor, 18);
    flash = 0.2;
  }

  // ===== 場景生成 (種子隨機, 確保重生一致) =====
  // 使用簡易 LCG 隨機
  var _scnSeed = 12345;
  function scnRand() {
    _scnSeed = (_scnSeed * 1664525 + 1013904223) % 4294967296;
    return _scnSeed / 4294967296;
  }

  function generateScenery() {
    scenery = [];
    _scnSeed = 12345; // 確保每次重玩都一致
    // 石碑 (碰撞體) — 6-10 個, 寬 18-28 高 26-36 px
    var graveCount = 6 + Math.floor(scnRand() * 5);
    for (var i = 0; i < graveCount; i++) {
      var x = 80 + scnRand() * (W - 160);
      var y = 80 + scnRand() * (H - 160);
      var gw = 18 + scnRand() * 10;
      var gh = 26 + scnRand() * 10;
      scenery.push({
        type: "gravestone",
        x: x, y: y,
        w: gw, h: gh,
        radius: Math.max(gw, gh) * 0.45,
        collide: true,
        stoneColor: ["#5a5a5a", "#6a6a6a", "#707070"][Math.floor(scnRand() * 3)],
        snowOnTop: scnRand() < 0.7,
        rot: (scnRand() - 0.5) * 0.4  // 微傾斜
      });
    }
    // 柵欄 (裝飾, 不碰撞) — 5-8 段, 80-120 px 長
    var fenceCount = 5 + Math.floor(scnRand() * 4);
    for (var f = 0; f < fenceCount; f++) {
      var fx = 60 + scnRand() * (W - 120);
      var fy = 60 + scnRand() * (H - 120);
      var flen = 80 + scnRand() * 40;
      var fang = scnRand() * Math.PI;
      scenery.push({
        type: "fence",
        x: fx, y: fy,
        length: flen,
        angle: fang,
        radius: 0,
        collide: false
      });
    }
    // 拱門 (裝飾, 不碰撞) — 2-3 個
    var archCount = 2 + Math.floor(scnRand() * 2);
    for (var a = 0; a < archCount; a++) {
      var ax = 100 + scnRand() * (W - 200);
      var ay = 100 + scnRand() * (H - 200);
      scenery.push({
        type: "arch",
        x: ax, y: ay,
        radius: 0,
        collide: false
      });
    }
    // 墓堆 (小裝飾, 不碰撞) — 8-12 堆
    var moundCount = 8 + Math.floor(scnRand() * 5);
    for (var m = 0; m < moundCount; m++) {
      var mx = 40 + scnRand() * (W - 80);
      var my = 40 + scnRand() * (H - 80);
      var msz = 8 + scnRand() * 6;
      scenery.push({
        type: "mound",
        x: mx, y: my,
        size: msz,
        radius: 0,
        collide: false,
        dirtColor: ["#3a2818", "#4a3018", "#2a1a10"][Math.floor(scnRand() * 3)]
      });
    }
  }

  // 檢查某點是否碰到碰撞體
  function collidesWithScenery(x, y, r) {
    for (var i = 0; i < scenery.length; i++) {
      var s = scenery[i];
      if (!s.collide) continue;
      if (Math.hypot(x - s.x, y - s.y) < r + s.radius) return s;
    }
    return null;
  }

  // 召喚機槍班: 2 位 AI 臥姿趴著 + 沙包銃架
  function spawnTeammates() {
    aiTeammates = [];
    // 隨玩家位置 200-300 px 範圍內隨機生成 (左右各一)
    var cx = player.x, cy = player.y;
    var side = Math.random() < 0.5 ? -1 : 1;
    var offsets = [
      [side * (220 + Math.random() * 80), -30 + Math.random() * 60],
      [-side * (220 + Math.random() * 80), -30 + Math.random() * 60]
    ];
    for (var i = 0; i < 2; i++) {
      aiTeammates.push({
        x: clamp(cx + offsets[i][0], 30, W - 30),
        y: clamp(cy + offsets[i][1], 30, H - 30),
        hp: 500, maxHp: 500,
        fireCd: i * 0.3,
        fireRate: 0.12,
        viewRange: 400,
        target: null,
        bobPhase: Math.random() * Math.PI * 2,
        facing: side * i > 0 ? 0 : 2  // 朝向玩家方向
      });
    }
    if (teammateTagEl) {
      teammateTagEl.classList.add("show");
      teammateTagEl.innerHTML = '🪖 機槍班 ×<span id="teammateCount">2</span>';
    }
    for (var k = 0; k < aiTeammates.length; k++) {
      burst(aiTeammates[k].x, aiTeammates[k].y, "#a4ff6b", 20);
    }
    flash = 0.3;
  }

  // ===== Update =====
  function update(dt) {
    gameTime += dt;

    // --- 玩家移動 ---
    var mx = 0, my = 0;
    if (keys["KeyW"] || keys["ArrowUp"]) my -= 1;
    if (keys["KeyS"] || keys["ArrowDown"]) my += 1;
    if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
    if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;
    if (touchMove) { mx += touchMove.dx; my += touchMove.dy; }
    var ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }

    _prevPx = player.x; _prevPy = player.y;
    var newX = clamp(player.x + mx * player.speed * dt, player.r, W - player.r);
    var newY = clamp(player.y + my * player.speed * dt, player.r, H - player.r);
    // 場景碰撞: 如果新位置會撞到,只允許 X 或 Y 方向的移動
    if (!collidesWithScenery(newX, newY, player.r)) {
      player.x = newX; player.y = newY;
    } else if (!collidesWithScenery(newX, player.y, player.r)) {
      player.x = newX;  // 只 X
    } else if (!collidesWithScenery(player.x, newY, player.r)) {
      player.y = newY;  // 只 Y
    }
    // 否則擋住不動

    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    player.facing = angleToFacing(player.angle);

    player.fireCd -= dt;
    if ((mouse.down || keys["Space"]) && player.fireCd <= 0) {
      shoot(); player.fireCd = player.fireRate;
    }
    if (player.dual) {
      if (player.fireCd2 < 0) player.fireCd2 = 0;
      player.fireCd2 -= dt;
      if ((mouse.down || keys["Space"]) && player.fireCd2 <= 0) {
        shootSecondary(); player.fireCd2 = player.fireRate2;
      }
    }
    if (player.inv > 0) player.inv -= dt;

    // --- 防護罩計時 ---
    if (player.shield.active) {
      player.shield.time -= dt;
      if (player.shield.time <= 0) {
        player.shield.active = false;
        player.shield.time = 0;
        burst(player.x, player.y, "#6bd4ff", 16);
      }
    }

    // --- 波次 ---
    spawnTimer -= dt;
    var spawnInterval = Math.max(0.35, 1.4 - wave * 0.12);
    if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = spawnInterval; }
    waveTimer += dt;
    if (waveTimer > 22) {
      waveTimer = 0;
      wave++;
      unlockWave(wave);
      // 第 13 波起,每波生成 1 隻 BOSS
      if (wave >= UNLOCK.BOSS_WAVE) {
        spawnBoss();
      }
      // 每波重置擊殺計數 + 動態調整目標
      killsThisWave = 0;
      evoGoal = 5 + Math.floor(wave * 0.5);
      updateHud();
    }

    // --- 子彈 (玩家) ---
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.z = (b.z || 0) + (b.vz || 0) * dt;
      b.vz = (b.vz || 0) + 380 * dt;
      b.life -= dt;
      b.rot = (b.rot || 0) + 12 * dt;
      // 子彈撞到場景碰撞體 → 消失 + 火花
      var hitScn = collidesWithScenery(b.x, b.y, b.r);
      if (hitScn) {
        burst(b.x, b.y, "#ffd34d", 3);
        bullets.splice(i, 1);
        continue;
      }
      // 刺蛇毒液: 落地後爆炸 AoE
      if (b.spit && (b.life <= 0 || b.z < 0)) {
        triggerExplosion(b.x, b.y, b.spitRadius || 60, b.spitDmg || 20);
        bullets.splice(i, 1);
        continue;
      }
      // 隊友火箭: 落地爆炸
      if (b.rocket && (b.life <= 0 || b.z < 0)) {
        triggerExplosion(b.x, b.y, b.aoeRadius || 80, b.dmg || 50);
        bullets.splice(i, 1);
        continue;
      }
      // BOSS 子彈打到玩家
      if (b.fromBoss && Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.r) {
        if (!player.shield.active && player.inv <= 0) {
          player.hp -= 10;
          player.inv = 0.5;
          burst(player.x, player.y, "#ff5a5a", 6);
          shake = 6;
          updateHud();
          if (player.hp <= 0) { gameOver(); return; }
        }
        bullets.splice(i, 1);
        continue;
      }
      if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40 || b.z < -2) {
        bullets.splice(i, 1);
      }
    }

    // --- 飛彈 (無人機) ---
    for (var mi = missiles.length - 1; mi >= 0; mi--) {
      var m = missiles[mi];
      m.life -= dt;
      // 追蹤邏輯: 若目標還活著,每幀微調速度向量往目標
      if (m.target) {
        var tgtStillAlive = false;
        for (var ee = 0; ee < enemies.length; ee++) {
          if (enemies[ee] === m.target && enemies[ee].hp > 0) { tgtStillAlive = true; break; }
        }
        if (tgtStillAlive) {
          var da = Math.atan2(m.target.y - m.y, m.target.x - m.x);
          var curA = Math.atan2(m.vy, m.vx);
          // 角度差,平滑轉向
          var diff = da - curA;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          var turnRate = 6; // rad/s
          if (diff > turnRate * dt) diff = turnRate * dt;
          if (diff < -turnRate * dt) diff = -turnRate * dt;
          var newA = curA + diff;
          var sp = Math.hypot(m.vx, m.vy);
          m.vx = Math.cos(newA) * sp;
          m.vy = Math.sin(newA) * sp;
        }
      }
      m.x += m.vx * dt; m.y += m.vy * dt;
      m.rot = Math.atan2(m.vy, m.vx);

      // 煙尾粒子
      if (Math.random() < 0.6) {
        particles.push({
          x: m.x - Math.cos(m.rot) * 4,
          y: m.y - Math.sin(m.rot) * 4,
          vx: (Math.random() - 0.5) * 30,
          vy: (Math.random() - 0.5) * 30,
          r: 2 + Math.random() * 2,
          life: 0.35, maxLife: 0.35,
          color: Math.random() < 0.5 ? "#888" : "#aaa"
        });
      }

      // 命中偵測
      var hit = false;
      for (var ej = enemies.length - 1; ej >= 0; ej--) {
        var en = enemies[ej];
        if (en.hp <= 0) continue;
        if (Math.hypot(m.x - en.x, m.y - en.y) < m.r + en.r + 4) {
          hit = true;
          break;
        }
      }
      // 撞到場景碰撞體
      if (!hit && collidesWithScenery(m.x, m.y, m.r + 2)) hit = true;
      // 距離過遠自爆
      var distToPlayer = Math.hypot(m.x - player.x, m.y - player.y);
      if (hit || m.life <= 0 || distToPlayer > 800) {
        // 爆炸 (AoE)
        triggerExplosion(m.x, m.y, 40, 30);
        missiles.splice(mi, 1);
        continue;
      }
    }

    // --- 爆炸擴散 ---
    for (var ex = explosions.length - 1; ex >= 0; ex--) {
      var e = explosions[ex];
      e.time -= dt;
      if (e.time <= 0) explosions.splice(ex, 1);
    }

    // --- 敵人 ---
    for (var j = enemies.length - 1; j >= 0; j--) {
      var e = enemies[j];
      var ea = Math.atan2(player.y - e.y, player.x - e.x);
      e._lastX = e.x; e._lastY = e.y;
      var eNewX = e.x + Math.cos(ea) * e.speed * dt;
      var eNewY = e.y + Math.sin(ea) * e.speed * dt;
      if (!collidesWithScenery(eNewX, eNewY, e.r)) {
        e.x = eNewX; e.y = eNewY;
      } else if (!collidesWithScenery(eNewX, e.y, e.r)) {
        e.x = eNewX;
      } else if (!collidesWithScenery(e.x, eNewY, e.r)) {
        e.y = eNewY;
      }
      e.facing = angleToFacing(ea);
      e._animPhase += 0.18;
      if (e.hitFlash > 0) e.hitFlash -= dt;

      // 撞玩家 (防護罩狀態下免疫)
      var dp = Math.hypot(player.x - e.x, player.y - e.y);
